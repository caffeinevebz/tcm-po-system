<html lang="en">

    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://unpkg.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src https://*.googleapis.com https://*.cloudfunctions.net https://*.firebaseio.com wss://*.firebaseio.com; frame-ancestors 'none'; base-uri 'self'; form-action 'none'; object-src 'none'">

            crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"
            integrity="sha384-XMIl1b2Ez9tKAM0R5q67/iLdfnlLBl9kfo40X5WMtCPb+3OLplrjnOxZTYCg1SKY"

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-functions-compat.js"

        TCM.installCrashHandler();

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Relative, not "/manifest.json": the absolute path 404s on a GitHub Pages
         project site, which is served from /<repo>/ rather than the domain root. -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="assets/favicon.png">
    <style>
        body { background-color: #FAF8F5; color: #132A1B; font-family: 'Inter', sans-serif; margin: 0; }
        .hide-scrollbar::-webkit-scrollbar { display: none; } .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        input[type="text"], input[type="number"], input[type="password"], select, textarea { transition: all 0.2s ease-in-out; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #D4AF37 !important; box-shadow: 0 0 0 1px #D4AF37 !important; }
        /* Was url('DSC_8017.jpg') — a 13 MB, 5743px original loaded on every
           dashboard visit. The derivative below is 131 KB and visually identical
           at screen sizes. `background-attachment: fixed` is dropped on touch
           devices because it forces a repaint on every scroll frame. */
        .bg-theme-orders { background-image: linear-gradient(rgba(250, 248, 245, 0.35), rgba(250, 248, 245, 0.35)), url('assets/bg-dashboard.jpg'); background-size: cover; background-attachment: fixed; background-position: center; }
        @media (hover: none) { .bg-theme-orders { background-attachment: scroll; } }
        .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
        .vintage-checkbox { appearance: none; width: 20px; height: 20px; border: 2px solid #8b5e3c; border-radius: 4px; background-color: #FAF8F5; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; }
        .vintage-checkbox:checked { background-color: #FAF8F5; border-color: #4A5D23; } .vintage-checkbox:checked::before { content: '✔'; color: #4A5D23; font-size: 14px; font-weight: bold; }
        @keyframes slide-up { 0% { transform: translateY(100%); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } } .animate-slide-up { animation: slide-up 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fade-in { 0% { opacity: 0; } 100% { opacity: 1; } } .animate-fade-in { animation: fade-in 0.3s ease-in-out; }
    </style>
</head>
<body>
    <!-- Nothing renders and no Firestore listener is opened until TCM.guard()
         confirms an owner-role session. Previously this page was reachable by
         simply typing its URL. -->
    <div id="auth-gate" class="min-h-screen flex items-center justify-center font-serif text-victorian bg-paper">
        <p class="animate-pulse font-bold tracking-widest uppercase text-sm">Verifying terminal…</p>
    </div>
    <div id="root" hidden></div>

    <script type="text/babel" data-presets="react">
        /** @jsx React.createElement */
        /** @jsxFrag React.Fragment */

        const { useState, useEffect } = React;

        // Firebase handles, unit maths, costing, id allocation and auth all live
        // in assets/tcm-core.js so owner.html and staff.html cannot drift apart.
        const { db, auth } = TCM;

        // --- SYSTEM CONSTANTS ---
        const DEFAULT_SUPPLIERS = [{name:"Rare Beans Company",phone:"8619122260"},{name:"Aditya Industries",phone:"9595711611"},{name:"Renu Devi & Sons",phone:"7737840411"},{name:"Cash Purchase",phone:""}];
        const DEFAULT_INVENTORY = {"Fruits and Vegetables":["Apple (सेव)","Avocado (अवोकेडो)","Banana (केले)","Broccoli (ब्रोकली)","Tomato (टमाटर)","Garlic (लहसुन)","Onion (प्याज़)","Mixed Bell Peppers (2:1:1 Green:Yellow:Red)"],"Coffee and Matcha":["Full House Green (Arabica)","Baarbara Green (Cold Brew)","Matcha (Premium)"],"Groceries":["Aata","Amul Butter","Amul Cheese","Sugar","Milk (Full Cream)","Olive Oil"],"Packing and Consumables":["Brown Paper Bag","Hot coffee cup","Pizza Boxes"]};
        const UNITS = TCM.UNITS;
        const RECIPE_CATEGORIES = ["Beverages","Kitchen","Desserts","Batch Prep"];

        // --- ICONS ENGINE ---
        const Icons = {
            Trash: ()=><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>,
            Edit: ()=><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>,
            Send: ()=><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>,
            Camera: ()=><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>,
            Check: ()=><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>,
            Menu: ()=><svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>,
            Close: ()=><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>,
            Activity: ()=><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>,
            Box: ()=><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>,
            FileText: ()=><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>,
            Users: ()=><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
        };

        const compressImage = TCM.compressImage;

        // Renders the reason a line could not be costed instead of showing a
        // confident ₹0.00. Silent zeroes were the most misleading thing in the
        // costing screen: an unpriced item and a free item looked identical.
        function CostWarning({ reason, priceUnit }) {
            if (!reason) return null;
            const label = TCM.COST_WARNINGS[reason] || 'Not costed';
            return (
                <span title={priceUnit ? `${label} (priced per ${priceUnit})` : label}
                      className="text-[9px] font-bold uppercase tracking-wider text-danger bg-dangerLight border border-danger/30 px-1.5 py-0.5 rounded">
                    {reason === 'unpriced' ? 'No price' : 'Unit mismatch'}
                </span>
            );
        }

        // --- SHARED UI COMPONENTS ---
        function DashboardMetric({ title, value, subtitle, icon, borderColor = "border-white/50" }) {
            return (
                <div className={`bg-white/80 backdrop-blur-xl p-6 rounded-2xl shadow-elegant border-t-4 ${borderColor} flex flex-col justify-between hover:-translate-y-1 transition-transform relative overflow-hidden group`}>
                    <div className="absolute -right-4 -top-4 opacity-5 group-hover:opacity-10 transition-opacity transform group-hover:scale-110"><svg width="100" height="100" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/></svg></div>
                    <div className="flex justify-between items-start mb-4 relative z-10"><p className="text-[11px] font-bold text-gray-500 uppercase tracking-widest leading-tight w-3/4">{title}</p><div className="text-victorian bg-paperDark/50 p-2.5 rounded-xl shadow-inner">{icon}</div></div>
                    <div className="relative z-10"><h3 className="text-4xl font-serif font-bold text-victorian tracking-tight">{value}</h3>{subtitle && <p className="text-[10px] text-brandBrown font-bold uppercase tracking-widest mt-2 bg-brandBrown/10 inline-block px-2 py-1 rounded">{subtitle}</p>}</div>
                </div>
            );
        }

        function DashboardLayout({ activeTab, setActiveTab, children }) {
            const [isSidebarOpen, setSidebarOpen] = useState(false);
            const ownerMenu = [
                { id: 'dashboard', label: 'Welcome Dashboard' },
                { id: 'orders', label: 'Manage Orders & POs' },
                { id: 'recipes', label: 'Kitchen Recipe Book' },
                { id: 'conversions', label: 'Prep Kitchen Engine' },
                { id: 'vendors', label: 'Vendor Directory' },
                { id: 'inventory', label: 'Raw Material Master' },
                { id: 'workbench', label: "Brewster's Workbench" }
            ];

            return (
                <div className="min-h-screen pb-24 lg:pb-0 transition-all duration-700 ease-in-out bg-theme-orders relative">
                    {isSidebarOpen && <div className="fixed inset-0 bg-black/40 backdrop-blur-sm z-40 transition-opacity" onClick={() => setSidebarOpen(false)}></div>}
                    <div className={`fixed inset-y-0 left-0 w-72 bg-victorian text-paper shadow-2xl z-50 transform transition-transform duration-300 ease-in-out ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full'}`}>
                        <div className="flex justify-between items-center p-4 border-b border-white/10 relative bg-white"><div className="w-full flex justify-center items-center py-4 px-2"><img src="assets/name.jpg" alt="TCM BrewOps" width="640" height="420" className="h-16 sm:h-20 object-contain mix-blend-multiply drop-shadow-sm w-full" /></div><button onClick={() => setSidebarOpen(false)} className="text-victorian hover:text-brandBrown absolute right-3 top-3 bg-white/80 rounded-full p-1 shadow-sm"><Icons.Close/></button></div>
                        <div className="p-4 space-y-2 flex flex-col h-[calc(100vh-120px)] overflow-y-auto hide-scrollbar"><div className="flex-1 space-y-2 mt-4"><p className="text-[10px] text-gray-500 uppercase tracking-widest font-bold px-4 mb-4">Owner Navigation</p>{ownerMenu.map(item => (<button key={item.id} onClick={() => { setActiveTab(item.id); setSidebarOpen(false); }} className={`w-full text-left px-4 py-3.5 font-bold text-xs uppercase tracking-widest rounded-xl transition-all ${activeTab === item.id ? 'bg-brandBrown text-white shadow-md' : 'text-gray-300 hover:bg-white/10 hover:text-white'}`}>{item.label}</button>))}</div><button onClick={() => TCM.signOut()} className="w-full text-left px-4 py-3.5 font-bold text-xs uppercase tracking-widest rounded-xl text-dangerLight hover:bg-danger/20 transition-all mt-6">Log Out</button></div>
                    </div>
                    <header className="bg-gradient-to-r from-[#e8dfd1] to-[#FAF8F5] border-b-2 border-brandBrown/30 px-4 py-3 shadow-md sticky top-0 z-30"><div className="flex items-center justify-between max-w-6xl mx-auto relative"><button onClick={() => setSidebarOpen(true)} className="text-victorian hover:text-brandBrown transition-colors p-2 rounded-lg hover:bg-black/5"><Icons.Menu/></button><div className="flex-1 flex justify-center py-1"><img src="assets/page-header.jpg" alt="TCM BrewOps" width="1200" height="201" className="h-12 sm:h-16 md:h-20 lg:h-24 object-contain mix-blend-multiply drop-shadow-sm" /></div><div className="w-12"></div></div></header>
                    <main className="max-w-6xl mx-auto mt-6 px-4 lg:px-6">{children}</main>
                </div>
            );
        }

        // --- OWNER VIEWS & LOGIC ---
        function OwnerDashboardSummary({ pos, requests, recipes, prepItems, suppliers, setOwnerTab }) {
            const activePOs = (pos || []).filter(po => po.status === 'Approved');
            const catCounts = (recipes || []).reduce((acc, r) => { acc[r.category || 'Other'] = (acc[r.category || 'Other'] || 0) + 1; return acc; }, {});
            const pieData = Object.keys(catCounts).map(key => ({ name: key, value: catCounts[key] }));
            const totalRecipes = pieData.reduce((sum, d) => sum + d.value, 0);
            const PIE_COLORS = ['#8b5e3c', '#4A5D23', '#D4AF37', '#23452F', '#c08a5b'];
            let cumulativePercent = 0;
            const conicGradientString = totalRecipes > 0 ? pieData.map((d, i) => { const start = cumulativePercent; const percent = (d.value / totalRecipes) * 100; cumulativePercent += percent; return `${PIE_COLORS[i % PIE_COLORS.length]} ${start}% ${cumulativePercent}%`; }).join(', ') : '#e5e7eb 0% 100%';
            const vendorCounts = (pos || []).reduce((acc, p) => { if(p.supplier) { acc[p.supplier] = (acc[p.supplier] || 0) + 1; } return acc; }, {});
            const barData = Object.keys(vendorCounts).map(key => ({ name: key.length > 12 ? key.substring(0, 12) + '...' : key, Orders: vendorCounts[key] })).sort((a, b) => (b.Orders || 0) - (a.Orders || 0)).slice(0, 5);
            const maxOrders = barData.length > 0 ? Math.max(...barData.map(d => d.Orders)) : 0;

            return (
                <div className="animate-fade-in space-y-8">
                    <div className="flex justify-between items-end"><h2 className="text-2xl font-serif font-bold text-victorian drop-shadow-sm border-b-2 border-brandBrown/30 pb-2 inline-block">System Command Center</h2></div>
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
                        <div onClick={()=>setOwnerTab('recipes')} className="cursor-pointer"><DashboardMetric title="Master Catalog" value={(recipes || []).length} icon={<Icons.FileText/>} borderColor="border-brandBrown" subtitle="Total Recipes Built" /></div>
                        <div onClick={()=>setOwnerTab('orders')} className="cursor-pointer"><DashboardMetric title="Active Shipments" value={activePOs.length} icon={<Icons.Box/>} borderColor={activePOs.length > 0 ? "border-vintageGreen" : "border-gray-200"} subtitle={activePOs.length > 0 ? "In Transit" : "All Received"} /></div>
                        <div onClick={()=>setOwnerTab('orders')} className="cursor-pointer"><DashboardMetric title="Pending Requests" value={(requests || []).length} icon={<Icons.Activity/>} borderColor={(requests || []).length > 0 ? "border-danger" : "border-gray-200"} subtitle={(requests || []).length > 0 ? "Needs Approval" : "Queue Empty"} /></div>
                        <div onClick={()=>setOwnerTab('vendors')} className="cursor-pointer"><DashboardMetric title="Active Vendors" value={(suppliers || []).length} icon={<Icons.Users/>} borderColor="border-antique" subtitle="Supply Chain" /></div>
                    </div>
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 pb-10">
                        <div className="bg-white/80 backdrop-blur-xl p-6 rounded-2xl shadow-elegant border border-white/50 flex flex-col">
                            <h3 className="text-xs font-bold text-gray-500 uppercase tracking-widest mb-6 border-b border-gray-200 pb-2">Menu Distribution</h3>
                            <div className="flex-1 flex items-center justify-center lg:justify-start lg:ml-10 min-h-[220px]">
                                {totalRecipes > 0 ? (
                                    <div className="flex items-center">
                                        <div className="w-40 h-40 rounded-full shadow-inner-vintage relative" style={{ background: `conic-gradient(${conicGradientString})` }}>
                                            <div className="absolute inset-4 bg-paper rounded-full shadow-elegant flex flex-col items-center justify-center"><span className="text-victorian font-bold text-2xl leading-none">{totalRecipes}</span></div>
                                        </div>
                                        <div className="ml-10 flex flex-col space-y-3 border-l-2 border-brandBrown/10 pl-6 py-2">
                                           {pieData.map((d, i) => (
                                               <div key={i} className="flex items-center"><div className="w-3.5 h-3.5 rounded-full mr-3 shadow-sm border border-black/10" style={{ backgroundColor: PIE_COLORS[i % PIE_COLORS.length] }}></div><span className="text-xs font-medium text-gray-700">{d.name || 'Unknown'} <span className="font-bold ml-1 text-victorian">({d.value || 0})</span></span></div>
                                           ))}
                                        </div>
                                    </div>
                                ) : ( <div className="flex h-full items-center justify-center text-sm text-gray-400 italic">No recipe data available</div> )}
                            </div>
                        </div>
                        <div className="bg-white/80 backdrop-blur-xl p-6 rounded-2xl shadow-elegant border border-white/50 flex flex-col">
                            <h3 className="text-xs font-bold text-gray-500 uppercase tracking-widest mb-6 border-b border-gray-200 pb-2">Top Suppliers (By Order Volume)</h3>
                            <div className="flex-1 min-h-[220px]">
                                {barData.length > 0 ? (
                                    <div className="flex items-end justify-around h-full pt-6 pb-2 px-4 gap-4 border-b-2 border-gray-200">
                                        {barData.map((d, i) => {
                                            const heightPct = maxOrders === 0 ? 0 : ((d.Orders || 0) / maxOrders) * 100;
                                            return (
                                                <div key={i} className="flex flex-col items-center flex-1 h-full justify-end group">
                                                    <span className="text-[10px] font-bold text-brandBrown mb-2 opacity-0 group-hover:opacity-100 transition-opacity">{d.Orders || 0} Orders</span>
                                                    <div className="w-full max-w-[40px] bg-brandBrown rounded-t-md transition-all duration-700 shadow-sm group-hover:bg-brandLightBrown" style={{ height: Math.max(heightPct, 5) + '%' }}></div>
                                                    <span className="text-[9px] text-gray-600 font-bold text-center mt-3 truncate w-full px-1">{d.name || 'Unknown'}</span>
                                                </div>
                                            )
                                        })}
                                    </div>
                                ) : ( <div className="flex h-full items-center justify-center text-sm text-gray-400 italic">No purchase history available</div> )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function OwnerView({ requests, pos, onCreateCombinedPO, onRemoveRequestItem, onDelete, onResend, suppliers, setSuppliers, addSupplier, editSupplier, deleteSupplier, inventory, prepItems, ownerPhone, recipes, units, ownerTab, setOwnerTab, prices, aliases, updateAlias, compressImage, showToast, confirmAction, Icons, db, deleteRecipe }) {
            const activePOs = (pos || []).filter(po => po.status === 'Approved'); const deliveredPOs = (pos || []).filter(po => po.status === 'Delivered');
            
            const [selectedItems, setSelectedItems] = useState([]); const [selectedVendor, setSelectedVendor] = useState(''); const [dbCategory, setDbCategory] = useState('');

                                                <div className="flex flex-col items-end space-y-3"><span className="text-[9px] px-2.5 py-1 rounded-lg font-bold uppercase tracking-widest shadow-sm bg-victorian text-paper">{po.status}</span><div className="flex space-x-2"><button onClick={(e) => { e.stopPropagation(); onResend(po); }} className="text-gray-400 hover:text-victorian p-1.5 rounded-lg bg-white/50 shadow-sm transition-colors"><Icons.Send/></button><button onClick={(e) => { e.stopPropagation(); onDelete(po.id); }} className="text-gray-400 hover:text-danger p-1.5 rounded-lg bg-white/50 shadow-sm transition-colors"><Icons.Trash/></button></div></div>
                                            </div>

                                            {expandedPOs[po.id] && editingDeliveredPO?.id !== po.id && (
                                                <div className="animate-fade-in mt-5 pt-4 border-t border-victorian/10">
                                                    <p className="text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-2 px-1">Initial Target Draft</p>
                                                    <ul className="text-xs space-y-2 mb-4 px-1">{(po.items || []).map((item, idx) => (<li key={`del-req-${idx}`} className="flex justify-between text-gray-600 border-b border-white/50 pb-1 last:border-0"><span>{item.name || 'Unknown'}</span><span className="font-medium">{item.qty || 0} {item.unit || ''}</span></li>))}</ul>

                                                    {po.receivedItems && (
                                                        <div className="bg-paper/70 p-4 rounded-xl border border-white/60 shadow-sm mb-4">
                                                            <p className="text-[10px] font-bold text-victorian uppercase tracking-widest mb-3">Intake Receipt ({po.deliveryDate || ''})</p>
                                                            <ul className="text-xs space-y-2.5">
                                                                {po.receivedItems.map((item, idx) => {
                                                                    const hasVar = item.qty !== item.receivedQty; const unitCost = item.receivedQty > 0 && item.totalPrice ? (item.totalPrice / item.receivedQty).toFixed(2) : 0;
                                                                    return (
                                                                        <li key={`rec-${idx}`} className={"flex justify-between items-center py-1.5 border-b border-white/50 last:border-0 " + (hasVar ? 'text-danger' : 'text-gray-700')}>
                                                                            <span className="truncate pr-2 font-medium">{item.name || 'Unknown'}</span>
                                                                            <div className="flex flex-col items-end text-right">
                                                                                <span className="whitespace-nowrap font-bold bg-white/50 px-2 py-0.5 rounded">{hasVar ? "Ord: " + item.qty + " → Rec: " + item.receivedQty + " " + item.unit : item.receivedQty + " " + item.unit + " (Verified)"}</span>
                                                                                {item.totalPrice > 0 && <span className="text-[9px] text-victorian/80 mt-1 uppercase tracking-widest font-bold">₹{item.totalPrice} (₹{unitCost}/{item.unit || ''})</span>}
                                                                            </div>
                                                                        </li>
                                                                    );
                                                                })}
                                                            </ul>
                                                        </div>
                                                    )}
                                                    <button onClick={(e) => { e.stopPropagation(); startEditingDeliveredPO(po); }} className="w-full bg-white border border-brandBrown/30 text-brandBrown uppercase tracking-widest text-[10px] font-bold py-3 rounded-xl shadow-sm flex items-center justify-center gap-2 hover:bg-brandBrown hover:text-white transition-colors"><Icons.Edit/> Audit Invoice / Price Correction</button>
                                                </div>
                                            )}
                                            {expandedPOs[po.id] && editingDeliveredPO?.id === po.id && (
                                                <div className="animate-fade-in mt-5 pt-4 border-t border-victorian/10">
                                                    <div className="bg-paper/80 p-4 rounded-xl border border-white/60 shadow-sm">
                                                        <div className="flex justify-between items-center mb-4"><p className="text-[10px] font-bold text-victorian uppercase tracking-widest">Update Order & Prices</p><button onClick={() => setEditingDeliveredPO(null)} className="text-danger text-[10px] font-bold uppercase tracking-widest bg-danger/10 px-2.5 py-1 rounded-md hover:bg-danger/20 transition-colors">Cancel</button></div>
                                                        <div className="relative mb-5"><input type="file" accept="image/*" multiple id={`edit-invoice-${po.id}`} className="hidden" onChange={handleOwnerRealAIScan} /><label htmlFor={`edit-invoice-${po.id}`} className={`w-full flex justify-center items-center py-3 border rounded-xl text-[10px] font-bold uppercase tracking-widest cursor-pointer transition-colors ${isOwnerScanning ? 'bg-antiqueLight/40 border-antique text-victorian shadow-inner' : 'bg-white border-victorian/30 text-victorian hover:border-victorian shadow-sm flex items-center gap-2'}`}>{isOwnerScanning ? '⏳ Processor...' : <><Icons.Camera/> Auto-Scan Invoice</>}</label></div>
                                                        <div className="space-y-3 mb-5">
                                                            <div className="flex justify-between text-[9px] font-bold text-gray-400 uppercase tracking-widest pb-2 border-b border-gray-200 space-x-2"><span className="w-2/5">Item Name</span><span className="w-1/5 text-center">Rec</span><span className="w-1/5 text-center">Inv (₹)</span></div>
                                                            {((po.receivedItems || po.items) || []).map((item, idx) => (
                                                                <div key={`edit-${idx}`} className="flex flex-col py-2 border-b border-gray-100 last:border-0">
                                                                    <div className="flex justify-between items-center space-x-2">
                                                                        <span className="text-[10px] w-2/5 pr-1 font-medium text-gray-800 leading-tight">{item.name || 'Unknown'} <span className="text-[8px] text-gray-400 block mt-0.5">({item.unit || ''})</span></span>
                                                                        <input type="number" min="0" step="any" className="w-1/5 border border-gray-200 rounded-lg p-2 text-center font-bold text-[10px] bg-white focus:ring-2 focus:ring-antique/50 shadow-inner" value={editQuantities[idx] || ''} onChange={(e) => setEditQuantities({...editQuantities, [idx]: e.target.value})} />
                                                                        <input type="number" min="0" step="any" placeholder="₹" className="w-1/5 border border-antique/50 rounded-lg p-2 text-center font-bold text-[10px] bg-white focus:ring-2 focus:ring-antique shadow-inner" value={editPrices[idx] || ''} onChange={(e) => setEditPrices({...editPrices, [idx]: e.target.value})} />
                                                                    </div>
                                                                    {unmatchedScans.length > 0 && (!editQuantities[idx] && !editPrices[idx]) && (
                                                                        <div className="mt-2 w-full"><select className="w-full text-[9px] border border-dashed border-antique bg-antiqueLight/20 text-victorian p-2 font-bold uppercase tracking-widest rounded-lg focus:outline-none" value="" onChange={(e) => { const scanObj = unmatchedScans.find(u => u.name === e.target.value); if(scanObj){ setEditQuantities({...editQuantities, [idx]: scanObj.quantity}); setEditPrices({...editPrices, [idx]: scanObj.totalPrice}); setUnmatchedScans(unmatchedScans.filter(u => u.name !== e.target.value)); updateAlias(e.target.value, item.name); showToast("Mapped!", "success"); } }}><option value="">🔗 Map missing item...</option>{unmatchedScans.map((u, ui) => (<option key={u.name + ui} value={u.name || ''}>{u.name || 'Unknown'} (Qty: {u.quantity || 0}, ₹{u.totalPrice || 0})</option>))}</select></div>
                                                                    )}
                                                                </div>
                                                            ))}
                                                        </div>
                                                        <button onClick={saveDeliveredPOEdit} className="w-full bg-brandBrown text-white uppercase tracking-widest text-[10px] font-bold py-3.5 rounded-xl hover:bg-brandLightBrown transition-all hover:shadow-md hover:-translate-y-0.5">Save & Update Master Prices</button>
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    ))
                                }
                            </div>
                        </div>
                    )}

                    {/* INTERACTIVE STAGING DISPATCH CONTROLLER LAYER */}
                    {ownerTab === 'orders' && selectedItems.length > 0 && (
                        <div className="fixed bottom-0 left-0 right-0 bg-paper/95 backdrop-blur-xl border-t-2 border-brandBrown/30 shadow-[0_-8px_40px_rgba(44,26,15,0.15)] p-5 z-40 animate-slide-up lg:left-auto lg:w-[420px] lg:right-8 lg:bottom-8 lg:rounded-2xl lg:border lg:border-brandBrown/20 lg:shadow-2xl">
                            <div className="max-w-md mx-auto flex flex-col space-y-4">
                                <div className="flex justify-between items-center">
                                    <span className="font-bold text-brandBrown bg-brandLightBrown/10 border border-brandBrown/30 px-3 py-1.5 rounded-lg text-[10px] uppercase tracking-widest shadow-sm"> Staging: {selectedItems.length} Items Selected</span>
                                    <button onClick={() => setSelectedItems([])} className="text-[10px] text-gray-400 font-bold hover:text-danger uppercase tracking-widest transition-colors bg-white hover:bg-danger/10 px-3 py-1.5 rounded-lg border border-gray-200">Clear</button>
                                </div>
                                
                                <div className="border-b border-gray-200 pb-2 flex justify-around text-xs font-bold uppercase tracking-wider">
                                    <button onClick={() => setAmendPoId('')} className={`pb-1 ${!amendPoId ? 'text-brandBrown border-b-2 border-brandBrown' : 'text-gray-400'}`}>New Purchase Order</button>
                                    <button onClick={() => { if(activePOs.length > 0) setAmendPoId(activePOs[0].id); else { showToast("No active open POs available to amend", "error"); setAmendPoId(''); } }} className={`pb-1 ${amendPoId ? 'text-brandBrown border-b-2 border-brandBrown' : 'text-gray-400'}`}>Amend Open PO</button>
                                </div>

                                {!amendPoId ? (
                                    <select value={selectedVendor} onChange={e => setSelectedVendor(e.target.value)} className="w-full p-4 border border-brandBrown/20 rounded-xl text-sm bg-white font-bold text-victorian shadow-inner focus:ring-2 focus:ring-brandBrown">
                                        <option value="">-- Choose Target Supplier --</option>
                                        {suppliers.map((s, idx) => <option key={`sel-ven-${idx}`} value={s.name || ''}>{s.name || 'Unknown'}</option>)}
                                    </select>
                                ) : (
                                    <select value={amendPoId} onChange={e => setAmendPoId(e.target.value)} className="w-full p-4 border border-brandBrown/20 rounded-xl text-sm bg-white font-bold text-brandBrown shadow-inner focus:ring-2 focus:ring-brandBrown">
                                        {activePOs.map((po, idx) => <option key={`sel-po-${idx}`} value={po.id}>{po.id} — [{po.supplier}]</option>)}
                                    </select>
                                )}

                                {availablePhonesList.length > 0 && (
                                    <div className="flex flex-col gap-2 mt-2 bg-white p-3 rounded-xl border border-brandBrown/20 shadow-sm">
                                        <span className="text-[10px] font-bold text-gray-500 uppercase tracking-widest">WhatsApp Multi-Route Targets:</span>
                                        {availablePhonesList.map(phone => (
                                            <label key={phone} className="flex items-center gap-3 cursor-pointer">
                                                <input type="checkbox" className="vintage-checkbox !w-4 !h-4" checked={targetPhones.includes(phone)} onChange={(e) => { if(e.target.checked) setTargetPhones([...targetPhones, phone]); else setTargetPhones(targetPhones.filter(p => p !== phone)); }} />
                                                <span className="text-sm font-medium text-victorian">{phone}</span>
                                            </label>
                                        ))}
                                    </div>
                                )}

                                <button onClick={handleGeneratePO} className="w-full bg-brandBrown text-white font-bold py-4 rounded-xl shadow-lg transition-all hover:-translate-y-0.5 uppercase tracking-widest text-xs flex justify-center items-center gap-2">
                                    <Icons.Send/> {amendPoId ? 'Update & Append Selected PO' : 'Dispatch New Official PO'}
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // --- ROOT APP COMPONENT ---
        function App() {
            const [loading, setLoading] = useState(true);
            const [ownerTab, setOwnerTab] = useState('dashboard'); 
            
            const [requests, setRequests] = useState([]); 
            const [pos, setPos] = useState([]); 
            const [poCounter, setPoCounter] = useState({ month: '', count: 1 });
            const [suppliers, setSuppliers] = useState([]); 
            const [inventory, setInventory] = useState(DEFAULT_INVENTORY);
            const [prepItems, setPrepItems] = useState([]); 
            const [ownerPhone, setOwnerPhone] = useState('');
            const [recipes, setRecipes] = useState([]); 
            const [prices, setPrices] = useState({}); 
            const [aliases, setAliases] = useState({});
            
            const [toast, setToast] = useState(null); 
            const [confirmDialog, setConfirmDialog] = useState(null);

            const showToast = (message, type = 'info') => { 
                setToast({ message, type }); 
                setTimeout(() => setToast(null), 3500); 
            };
            
            const confirmAction = (message, onConfirm) => { 
                setConfirmDialog({ message, onConfirm: () => { onConfirm(); setConfirmDialog(null); } }); 
            };

            useEffect(() => {
                let unsubSettings = () => {}; 
                let unsubReqs = () => {}; 
                let unsubPOs = () => {}; 
                let unsubRecipes = () => {};
                
                const initializeDB = async () => {
                    const settingsRef = db.collection('settings').doc('main'); 
                    const docSnap = await settingsRef.get();
                    
                    if (!docSnap.exists) {
                        const now = new Date(); 
                        const initialMonth = `${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getFullYear()).slice(-2)}`;
                        await settingsRef.set({ suppliers: DEFAULT_SUPPLIERS, inventory: DEFAULT_INVENTORY, prepItems: [], poCounter: { month: initialMonth, count: 1 }, ownerPhone: '', prices: {}, aliases: {} });
                    }
                    
                    unsubSettings = settingsRef.onSnapshot(doc => {
                        if (doc.exists) {
                            const data = doc.data(); 
                            const rawInv = data.inventory || DEFAULT_INVENTORY; 
                            const scrubbedInv = {};
                            
                            if (rawInv['Amul Milk']) { 
                                delete rawInv['Amul Milk']; 
                                settingsRef.update({ inventory: rawInv }); 
                            }

                            Object.keys(rawInv).forEach(key => { 
                                scrubbedInv[key] = [...new Set(rawInv[key])]; 
                            });
                            
                            setSuppliers(data.suppliers || DEFAULT_SUPPLIERS); 
                            setInventory(scrubbedInv); 
                            setPrepItems(data.prepItems || []); 
                            setPoCounter(data.poCounter || { month: '', count: 1 }); 
                            setOwnerPhone(data.ownerPhone || ''); 
                            setPrices(data.prices || {}); 
                            setAliases(data.aliases || {});
                        }
                    });
                    
                    // Newest first. Prefer the explicit createdAt stamp and fall
                    // back to the id, so requests written before that field
                    // existed still sort sensibly.
                    const newestFirst = (a, b) =>
                        String(b.createdAt || b.id || '').localeCompare(String(a.createdAt || a.id || ''));

                    unsubReqs = db.collection('requests').onSnapshot(snap => {
                        const reqData = [];
                        snap.forEach(d => reqData.push(d.data()));
                        setRequests(reqData.sort(newestFirst));
                    }, err => { console.error(err); showToast("Lost connection to requests.", "error"); });

                    unsubPOs = db.collection('pos').onSnapshot(snap => {
                        const poData = [];
                        snap.forEach(d => poData.push(d.data()));
                        setPos(poData.sort((a,b) => String(b.id || '').localeCompare(String(a.id || ''))));
                    }, err => { console.error(err); showToast("Lost connection to purchase orders.", "error"); });

                    unsubRecipes = db.collection('recipes').onSnapshot(snap => {
                        const recData = [];
                        snap.forEach(d => recData.push(d.data()));
                        setRecipes(recData.sort((a,b) => String(a.name || '').localeCompare(String(b.name || ''))));
                    }, err => { console.error(err); showToast("Lost connection to the recipe book.", "error"); });

                    setLoading(false);
                };
                
                initializeDB().catch(err => {
                    console.error(err);
                    setLoading(false);
                    showToast("Could not reach the database. Check your connection and sign in again.", "error");
                });
                return () => { unsubSettings(); unsubReqs(); unsubPOs(); unsubRecipes(); };
            }, []);

            const updateAlias = (rawInvoiceName, dbItemName) => { 
                const newAliases = { ...aliases, [rawInvoiceName]: dbItemName }; 
                setAliases(newAliases); 
                db.collection('settings').doc('main').update({ aliases: newAliases }); 
            };
            
            // Unit conversion and costing moved to TCM.costOf / TCM.costRecipe.
            // The version that lived here understood only ml<->Ltr and gms<->Kg;
            // every other pairing fell through with factor = 1, so a recipe
            // calling for 30 gms of a bean priced per Kg was costed as 30 Kg.

            // PO numbers are allocated by TCM.nextPoNumber, which does the
            // read-modify-write inside a Firestore transaction. The old version
            // computed the next number from React state and wrote it back with a
            // plain update(), so two POs raised close together took the same
            // number — and because POs are written with .set(), the second one
            // silently overwrote the first.

            const sendWhatsApp = (po, isAmendment = false, customPhones = null) => {
                if(po.supplier === "Cash Purchase") return showToast("Internal Cash Purchase PO generated.", "info");
                
                const itemList = (po.items || []).map((i, index) => `${index + 1}. ${i.name || ''} — ${i.qty || 0} ${i.unit || ''}`).join('\n');
                
                let prefix = '';
                if (po.status === 'Delivered') prefix = `*[RESENT FOR RECORDS]*\n`;
                else if (isAmendment) prefix = `*[AMENDED PURCHASE ORDER]*\n`;

                const message = `${prefix}*Subject:* Purchase Order - The Caffeine Ministry\n*PO Number:* ${po.id || ''}\n*Date:* ${po.date || ''}\n\nHello ${po.supplier || ''},\nPlease arrange the delivery of the following items:\n\n*Order Details:*\n${itemList}\n\n*Delivery Address:*\nThe Caffeine Ministry \n'PARASUDAI', 672, 12th C Road, \nSardarpura, Jodhpur\n\nThank you,\nTeam Caffeine Ministry`;
                
                let phonesToUse = customPhones;
                
                if (!phonesToUse) {
                    const savedPhones = po.supplierPhone ? po.supplierPhone.split(',').map(p=>p.trim()).filter(Boolean) : [];
                    if (savedPhones.length > 1) {
                        const sel = window.prompt("Multiple numbers found. Enter target to text:\n" + savedPhones.join(' | '), savedPhones[0]);
                        if (!sel) return; 
                        phonesToUse = [sel.trim()];
                    } else { 
                        phonesToUse = savedPhones; 
                    }
                }
                
                if (!phonesToUse || phonesToUse.length === 0) return showToast("PO saved (No phone checked).", "info");
                
                // The first window.open runs inside the click's user gesture so
                // it is not blocked; only subsequent ones are staggered. The old
                // loop deferred every open behind a setTimeout, which meant popup
                // blockers silently dropped all of them.
                phonesToUse.forEach((phone, idx) => {
                    const url = 'https://wa.me/' + TCM.normalizePhone(phone) + '?text=' + encodeURIComponent(message);
                    if (idx === 0) window.open(url, '_blank', 'noopener');
                    else setTimeout(() => window.open(url, '_blank', 'noopener'), idx * 800);
                });
            };

            const createCombinedPO = async (selectedItems, vendorObj, targetPhones) => {
                const combinedItems = [];
                selectedItems.forEach(si => {
                    const existing = combinedItems.find(i => i.name === si.item.name && i.unit === si.item.unit);
                    if (existing) {
                        existing.qty = Number(existing.qty) + Number(si.item.qty);
                    } else {
                        combinedItems.push({...si.item, qty: Number(si.item.qty)});
                    }
                });

                let newPo;
                try {
                    // Transactional allocation — see TCM.nextPoNumber.
                    const rawPoId = await TCM.nextPoNumber();
                    newPo = { id: rawPoId, supplier: vendorObj.name, supplierPhone: vendorObj.phone, status: 'Approved', date: TCM.today(), items: combinedItems };
                    await db.collection('pos').doc(TCM.poDocId(rawPoId)).set(newPo);
                } catch (err) {
                    console.error(err);
                    return showToast("Could not raise the PO — nothing was sent.", "error");
                }

                // Only clear the source requests once the PO is safely written.
                const reqsToUpdate = {};
                selectedItems.forEach(si => {
                    if (!reqsToUpdate[si.reqId]) reqsToUpdate[si.reqId] = [];
                    reqsToUpdate[si.reqId].push(si.itemIndex);
                });

                try {
                    const batch = db.batch();
                    Object.keys(reqsToUpdate).forEach(reqId => {
                        const req = requests.find(r => r.id === reqId);
                        if (!req) return;
                        const indicesToRemove = reqsToUpdate[reqId];
                        const remaining = (req.items || []).filter((_, idx) => !indicesToRemove.includes(idx));
                        const ref = db.collection('requests').doc(reqId);
                        if (remaining.length === 0) batch.delete(ref);
                        else batch.update(ref, { items: remaining });
                    });
                    await batch.commit();
                } catch (err) {
                    console.error(err);
                    showToast(`PO ${newPo.id} was raised, but the staff request could not be cleared.`, "error");
                }

                sendWhatsApp(newPo, false, targetPhones);
            };

            const removeRequestItem = (reqId, itemIndex) => confirmAction("Remove item?", () => { const req = requests.find(r => r.id === reqId); const remaining = (req.items || []).filter((_, idx) => idx !== itemIndex); if (remaining.length === 0) db.collection('requests').doc(reqId).delete(); else db.collection('requests').doc(reqId).update({ items: remaining }); });
            const deletePO = (poId) => confirmAction(`Delete purchase order ${poId}? This cannot be undone.`, () => db.collection('pos').doc(TCM.poDocId(poId)).delete().catch(() => showToast("Could not delete.", "error")));

            if (loading) return ( <div className="min-h-screen bg-paper flex flex-col items-center justify-center font-serif text-victorian"> <p className="animate-pulse font-bold tracking-widest uppercase">Loading BrewOps Engine...</p> </div> );

            return (
                <React.Fragment>
                    {toast && ( <div className="fixed bottom-6 left-1/2 transform -translate-x-1/2 z-[100] animate-slide-up"> <div className={`px-6 py-3 rounded-full shadow-2xl backdrop-blur-md border border-white/20 font-medium text-sm text-white flex items-center space-x-2 ${toast.type === 'error' ? 'bg-danger/90' : 'bg-victorian/90'}`}> <Icons.Check /> <span>{toast.message}</span> </div> </div> )}
                    {confirmDialog && ( <div className="fixed inset-0 bg-victorian/60 backdrop-blur-sm flex items-center justify-center p-4 z-[100] animate-fade-in"> <div className="bg-paper p-6 rounded-2xl shadow-2xl w-full max-w-sm border border-antique/30 text-center"> <h3 className="font-serif font-bold text-xl text-victorian mb-2">Are you sure?</h3> <p className="text-sm text-gray-600 mb-6">{confirmDialog.message}</p> <div className="flex space-x-3"> <button onClick={() => setConfirmDialog(null)} className="w-1/2 bg-white border border-gray-200 text-gray-600 font-bold py-3 text-xs uppercase tracking-widest rounded-xl hover:bg-gray-50 transition-colors">Cancel</button> <button onClick={confirmDialog.onConfirm} className="w-1/2 bg-danger text-white font-bold py-3 text-xs uppercase tracking-widest rounded-xl hover:bg-danger/90 transition-colors shadow-md">Confirm</button> </div> </div> </div> )}
                    
                    <DashboardLayout activeTab={ownerTab} setActiveTab={setOwnerTab}>
                        <OwnerView requests={requests} pos={pos} onCreateCombinedPO={createCombinedPO} onRemoveRequestItem={removeRequestItem} onDelete={deletePO} onResend={sendWhatsApp} suppliers={suppliers} setSuppliers={setSuppliers} addSupplier={()=>{const n = window.prompt("Vendor Name:"); if(n) {const p = window.prompt("Mobile Number(s) (comma separated for multiple):"); db.collection('settings').doc('main').update({suppliers:[...suppliers,{name:n.trim(),phone:p?p.trim():""}]});showToast("Added", "success");}}} editSupplier={(old)=>{const v=suppliers.find(s=>s.name===old); if(v){const n=window.prompt("Name:",v.name); if(n){const p=window.prompt("Mobile Number(s) (comma separated for multiple):",v.phone); db.collection('settings').doc('main').update({suppliers:suppliers.map(s=>s.name===old?{name:n.trim(),phone:p?p.trim():""}:s)});}}}} deleteSupplier={(n)=>confirmAction(`Delete vendor?`, ()=>db.collection('settings').doc('main').update({suppliers:suppliers.filter(s=>s.name!==n)}))} inventory={inventory} prepItems={prepItems} ownerPhone={ownerPhone} recipes={recipes} units={UNITS} ownerTab={ownerTab} setOwnerTab={setOwnerTab} prices={prices} aliases={aliases} updateAlias={updateAlias} compressImage={compressImage} showToast={showToast} confirmAction={confirmAction} Icons={Icons} db={db} deleteRecipe={(id) => { confirmAction("Delete this recipe?", () => { db.collection('recipes').doc(id).delete(); showToast("Recipe deleted", "info"); }); }} />
                    </DashboardLayout>
                </React.Fragment>
            );
        }

        // Nothing mounts — and no Firestore listener opens — until the session is
        // confirmed to carry the 'owner' role. TCM.guard redirects to the login
        // page instead of resolving when it is not, so this render is only ever
        // reached by an authenticated owner. The server-side rules in
        // firestore.rules are the real enforcement; this is the UX half.
        TCM.guard('owner').then(() => {
            document.getElementById('auth-gate').remove();
            const rootEl = document.getElementById('root');
            rootEl.hidden = false;
            ReactDOM.createRoot(rootEl).render(<App />);
            TCM.registerServiceWorker();
        });
    </script>
</body>
</html>
