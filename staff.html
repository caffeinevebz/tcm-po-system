<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrewOps - Staff Terminal</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-functions-compat.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = { theme: { extend: { colors: { paper: '#FAF8F5', victorian: '#132A1B', antique: '#D4AF37', antiqueLight: '#F2DF96', danger: '#8B2626', brandBrown: '#8b5e3c' }, fontFamily: { serif: ['"Playfair Display"', 'serif'], sans: ['"Inter"', 'sans-serif'] } } } }
    </script>
    <style>
        body { background-color: #FAF8F5; color: #132A1B; font-family: 'Inter', sans-serif; margin: 0; }
        .hide-scrollbar::-webkit-scrollbar { display: none; } .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .bg-theme-orders { background-image: linear-gradient(rgba(250, 248, 245, 0.35), rgba(250, 248, 245, 0.35)), url('DSC_8017.jpg'); background-size: cover; background-attachment: fixed; background-position: center; }
        @keyframes slide-up { 0% { transform: translateY(100%); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } } .animate-slide-up { animation: slide-up 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fade-in { 0% { opacity: 0; } 100% { opacity: 1; } } .animate-fade-in { animation: fade-in 0.3s ease-in-out; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-presets="react">
        /** @jsx React.createElement */
        /** @jsxFrag React.Fragment */

        const { useState, useEffect } = React;

        const firebaseConfig = { apiKey: "AIzaSyAcE76Pc46oOJ3FMqb4kcojbvq5ACPuwaE", authDomain: "tcm-orders.firebaseapp.com", projectId: "tcm-orders", storageBucket: "tcm-orders.firebasestorage.app", messagingSenderId: "994764639663", appId: "1:994764639663:web:2b0a682f2cb1001d37335a" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore(); 
        const functions = firebase.functions();

        const UNITS = ["Kg","gms","Piece","Pkt","Jar","Carton","Tin","bunch","Ltr","ml","tsp","tbsp","Bottle"]; 
        const RECIPE_CATEGORIES = ["Beverages","Kitchen","Desserts","Batch Prep"];

        const Icons = {
            Trash: ()=><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>,
            Camera: ()=><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>,
            Check: ()=><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>,
            Menu: ()=><svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>,
            Close: ()=><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>,
            Send: ()=><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>,
            Box: ()=><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>,
            FileText: ()=><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
        };

        const compressImage = (file) => new Promise((resolve, reject) => { const reader = new FileReader(); reader.readAsDataURL(file); reader.onload = (event) => { const img = new Image(); img.src = event.target.result; img.onload = () => { const canvas = document.createElement('canvas'); const scaleSize = 1500 / img.width; canvas.width = 1500; canvas.height = img.height * scaleSize; canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height); resolve(canvas.toDataURL('image/jpeg', 0.8).split(',')[1]); }; img.onerror = reject; }; reader.onerror = reject; });

        function App() {
            const [loading, setLoading] = useState(true);
            const [activeTab, setActiveTab] = useState('dashboard');
            const [isSidebarOpen, setSidebarOpen] = useState(false);
            
            const [inventory, setInventory] = useState({});
            const [requests, setRequests] = useState([]);
            const [pos, setPos] = useState([]);
            const [recipes, setRecipes] = useState([]);
            const [aliases, setAliases] = useState({});
            const [ownerPhone, setOwnerPhone] = useState('');
            
            const [toast, setToast] = useState(null);
            
            const [cart, setCart] = useState([]); 
            const [selectedCategory, setSelectedCategory] = useState(''); 
            const [searchTerm, setSearchTerm] = useState('');
            
            const [receivingPO, setReceivingPO] = useState(null); 
            const [receivedQuantities, setReceivedQuantities] = useState({}); 
            const [receivedPrices, setReceivedPrices] = useState({}); 
            const [unmatchedScans, setUnmatchedScans] = useState([]); 
            const [isScanning, setIsScanning] = useState(false);
            
            const [recipeSearchFilter, setRecipeSearchFilter] = useState(''); 
            const [activeRecipeTab, setActiveRecipeTab] = useState('All');
            const [viewingRecipe, setViewingRecipe] = useState(null);

            const [showAddModal, setShowAddModal] = useState(false); 
            const [modalItemName, setModalItemName] = useState(''); 
            const [modalQty, setModalQty] = useState(''); 
            const [modalUnit, setModalUnit] = useState('Kg');

            const showToast = (message, type = 'info') => { setToast({ message, type }); setTimeout(() => setToast(null), 3500); };

            useEffect(() => {
                const settingsRef = db.collection('settings').doc('main');
                const unsubSettings = settingsRef.onSnapshot(doc => {
                    if (doc.exists) {
                        const data = doc.data();
                        const rawInv = data.inventory || {};
                        const scrubbedInv = {};
                        Object.keys(rawInv).forEach(key => { scrubbedInv[key] = [...new Set(rawInv[key])]; });
                        setInventory(scrubbedInv);
                        if(Object.keys(scrubbedInv).length > 0 && !selectedCategory) setSelectedCategory(Object.keys(scrubbedInv)[0]);
                        setAliases(data.aliases || {});
                        setOwnerPhone(data.ownerPhone || '');
                    }
                });
                
                const unsubReqs = db.collection('requests').onSnapshot(snap => { 
                    const reqData = []; snap.forEach(d => reqData.push(d.data())); setRequests(reqData); 
                });
                
                const unsubPOs = db.collection('pos').onSnapshot(snap => { 
                    const poData = []; snap.forEach(d => poData.push(d.data())); setPos(poData); 
                });
                
                const unsubRecipes = db.collection('recipes').onSnapshot(snap => { 
                    const recData = []; snap.forEach(d => recData.push(d.data())); setRecipes(recData); 
                });
                
                setLoading(false);
                return () => { unsubSettings(); unsubReqs(); unsubPOs(); unsubRecipes(); };
            }, [selectedCategory]);

            // DRAFTING LOGIC
            const openAddModal = (item) => { if (cart.find(i => i.name === item)) return showToast("Already in cart", "error"); setModalItemName(item); setModalQty(''); setModalUnit('Kg'); setShowAddModal(true); };
            const confirmAddItem = () => { if(!modalQty || Number(modalQty) <= 0) return showToast("Invalid quantity", "error"); setCart([...cart, { name: modalItemName, qty: Number(modalQty), unit: modalUnit }]); setShowAddModal(false); };
            const removeItem = (index) => setCart(cart.filter((_, i) => i !== index));
            
            const handleSubmit = () => { 
                if (cart.length === 0) return showToast('Cart is empty', 'error'); 
                const reqId = 'REQ-' + Math.floor(1000 + Math.random() * 9000); 
                db.collection('requests').doc(reqId).set({ id: reqId, items: cart, date: new Date().toLocaleDateString('en-GB') });
                
                if (ownerPhone) {
                    const itemList = cart.map((i, index) => `${index + 1}. ${i.name || ''} — ${i.qty || 0} ${i.unit || ''}`).join('\n');
                    const message = `*New Master Request: ${reqId}*\n\nHello, the staff has prepared a new order list.\n\n*Items Requested:*\n${itemList}\n\nPlease check the TCM Dashboard.`;
                    let phoneStr = ownerPhone.replace(/\D/g, ''); if (phoneStr.length === 10) phoneStr = '91' + phoneStr; 
                    window.open('https://wa.me/' + phoneStr + '?text=' + encodeURIComponent(message), '_blank');
                } else {
                    showToast('Master Request sent!', 'success');
                }
                setCart([]); setSearchTerm(''); 
            };

            // SCANNING LOGIC
            const openReceiveScreen = (po) => { setReceivingPO(po); const initialQty = {}; const initialPrices = {}; (po.items || []).forEach((item, idx) => { initialQty[idx] = item.qty || 0; initialPrices[idx] = ''; }); setReceivedQuantities(initialQty); setReceivedPrices(initialPrices); setUnmatchedScans([]); };

            const handleRealAIScan = async (e) => {
                const files = Array.from(e.target.files); if (files.length === 0) return; setIsScanning(true);
                try {
                    let allScannedItems = []; const scanInvoice = firebase.functions().httpsCallable('scanInvoice');
                    for (let file of files) { const compressedBase64 = await compressImage(file); const response = await scanInvoice({ image: compressedBase64 }); if (response.data.lineItems) allScannedItems = [...allScannedItems, ...response.data.lineItems]; }
                    const autoQty = { ...receivedQuantities }; const autoPrices = { ...receivedPrices }; const unmatched = []; const usedScans = new Set();
                    (receivingPO.items || []).forEach((poItem, idx) => { let matchIndex = allScannedItems.findIndex((scan, i) => !usedScans.has(i) && aliases[scan.name] === poItem.name); if (matchIndex === -1) matchIndex = allScannedItems.findIndex((scan, i) => !usedScans.has(i) && ((poItem.name || '').toLowerCase().includes((scan.name || '').toLowerCase().split(' ')[0]) || (scan.name || '').toLowerCase().includes((poItem.name || '').toLowerCase().split(' ')[0]))); if (matchIndex !== -1) { const match = allScannedItems[matchIndex]; autoQty[idx] = match.quantity; autoPrices[idx] = match.totalPrice; usedScans.add(matchIndex); } else { autoQty[idx] = ''; autoPrices[idx] = ''; } });
                    allScannedItems.forEach((scan, i) => { if (!usedScans.has(i)) unmatched.push(scan); });
                    setReceivedQuantities(autoQty); setReceivedPrices(autoPrices); setUnmatchedScans(unmatched);
                    if (unmatched.length > 0) showToast(`Mapped partially. Map ${unmatched.length} items below.`, 'info'); else showToast("Perfect Auto-Match!", 'success');
                } catch (error) { showToast(`Scan failed.`, 'error'); } finally { setIsScanning(false); }
            };

            const submitReceive = () => { 
                const receivedItemsData = (receivingPO.items || []).map((item, idx) => ({ ...item, receivedQty: Number(receivedQuantities[idx]) || 0, totalPrice: Number(receivedPrices[idx]) || 0 })); 
                db.collection('pos').doc(receivingPO.id.replace(/\//g, '-')).update({ status: 'Delivered', receivedItems: receivedItemsData, deliveryDate: new Date().toLocaleDateString('en-GB') });
                setReceivingPO(null); showToast('Intake registered!', 'success');
            };

            if (loading) return <div className="min-h-screen bg-paper flex items-center justify-center font-serif text-victorian animate-pulse">Loading Staff Terminal...</div>;

            const activePOs = pos.filter(po => po.status === 'Approved');
            const displayedItems = searchTerm.trim() !== '' ? [...new Set(Object.values(inventory).flat())].filter(item => (item || '').toLowerCase().includes(searchTerm.toLowerCase())) : (inventory[selectedCategory] || []);
            const displayedRecipes = recipes.filter(r => { const matchesSearch = (r.name || '').toLowerCase().includes(recipeSearchFilter.toLowerCase()); const matchesCat = activeRecipeTab === 'All' || (r.category || 'Beverages') === activeRecipeTab; return matchesSearch && matchesCat; });

            return (
                <div className="min-h-screen pb-24 lg:pb-0 transition-all duration-700 ease-in-out bg-theme-orders relative">
                    {toast && ( <div className="fixed bottom-6 left-1/2 transform -translate-x-1/2 z-[100] animate-slide-up"> <div className={`px-6 py-3 rounded-full shadow-2xl backdrop-blur-md border border-white/20 font-medium text-sm text-white flex items-center space-x-2 ${toast.type === 'error' ? 'bg-danger/90' : 'bg-victorian/90'}`}> <Icons.Check /> <span>{toast.message}</span> </div> </div> )}
                    
                    {isSidebarOpen && <div className="fixed inset-0 bg-black/40 backdrop-blur-sm z-40" onClick={() => setSidebarOpen(false)}></div>}
                    <div className={`fixed inset-y-0 left-0 w-72 bg-victorian text-paper shadow-2xl z-50 transform transition-transform duration-300 ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full'}`}>
                        <div className="flex justify-between items-center p-4 border-b border-white/10 bg-white relative">
                            <div className="w-full flex justify-center items-center py-4"><img src="Name.jpg" className="h-16 object-contain mix-blend-multiply drop-shadow-sm w-full" /></div>
                            <button onClick={() => setSidebarOpen(false)} className="text-victorian hover:text-brandBrown absolute right-3 top-3 bg-white/80 rounded-full p-1"><Icons.Close/></button>
                        </div>
                        <div className="p-4 space-y-2 flex flex-col h-[calc(100vh-120px)]">
                            <div className="flex-1 space-y-2 mt-4">
                                <p className="text-[10px] text-gray-500 uppercase tracking-widest font-bold px-4 mb-4">Staff Navigation</p>
                                {[{ id: 'dashboard', label: 'Dashboard' }, { id: 'order', label: 'Draft BrewOps Order' }, { id: 'recipes', label: 'Recipe Book' }].map(item => (
                                    <button key={item.id} onClick={() => { setActiveTab(item.id); setSidebarOpen(false); }} className={`w-full text-left px-4 py-3.5 font-bold text-xs uppercase tracking-widest rounded-xl transition-all ${activeTab === item.id ? 'bg-brandBrown text-white shadow-md' : 'text-gray-300 hover:bg-white/10 hover:text-white'}`}>{item.label}</button>
                                ))}
                            </div>
                            <button onClick={() => window.location.href='index.html'} className="w-full text-left px-4 py-3.5 font-bold text-xs uppercase tracking-widest rounded-xl text-dangerLight hover:bg-danger/20 transition-all mt-6">Log Out</button>
                        </div>
                    </div>

                    <header className="bg-gradient-to-r from-[#e8dfd1] to-[#FAF8F5] border-b-2 border-brandBrown/30 px-4 py-3 shadow-md sticky top-0 z-30">
                        <div className="flex items-center justify-between max-w-6xl mx-auto"><button onClick={() => setSidebarOpen(true)} className="text-victorian hover:text-brandBrown p-2 rounded-lg hover:bg-black/5"><Icons.Menu/></button><div className="flex-1 flex justify-center py-1"><img src="Page-Header.jpg" className="h-12 sm:h-16 object-contain mix-blend-multiply drop-shadow-sm" /></div><div className="w-12"></div></div>
                    </header>

                    <main className="max-w-6xl mx-auto mt-6 px-4 lg:px-6">
                        {activeTab === 'dashboard' && (
                            <div className="animate-fade-in space-y-6">
                                <h2 className="text-2xl font-serif font-bold text-victorian drop-shadow-sm mb-2">Terminal Overview</h2>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                                    <div onClick={()=>setActiveTab('order')} className="cursor-pointer bg-white/80 backdrop-blur-xl p-6 rounded-2xl shadow-elegant border-t-4 border-vintageGreen flex flex-col justify-between hover:-translate-y-1 transition-transform relative overflow-hidden group">
                                        <div className="flex justify-between items-start mb-4 relative z-10"><p className="text-[11px] font-bold text-gray-500 uppercase tracking-widest">Incoming Deliveries</p><div className="text-victorian bg-paperDark/50 p-2.5 rounded-xl shadow-inner"><Icons.Box/></div></div>
                                        <div className="relative z-10"><h3 className="text-4xl font-serif font-bold text-victorian tracking-tight">{activePOs.length}</h3><p className="text-[10px] text-brandBrown font-bold uppercase tracking-widest mt-2 bg-brandBrown/10 inline-block px-2 py-1 rounded">Scanner intake required</p></div>
                                    </div>
                                    <div onClick={()=>setActiveTab('order')} className="cursor-pointer bg-white/80 backdrop-blur-xl p-6 rounded-2xl shadow-elegant border-t-4 border-brandBrown flex flex-col justify-between hover:-translate-y-1 transition-transform relative overflow-hidden group">
                                        <div className="flex justify-between items-start mb-4 relative z-10"><p className="text-[11px] font-bold text-gray-500 uppercase tracking-widest">Requests Awaiting Approval</p><div className="text-victorian bg-paperDark/50 p-2.5 rounded-xl shadow-inner"><Icons.FileText/></div></div>
                                        <div className="relative z-10"><h3 className="text-4xl font-serif font-bold text-victorian tracking-tight">{requests.length}</h3><p className="text-[10px] text-brandBrown font-bold uppercase tracking-widest mt-2 bg-brandBrown/10 inline-block px-2 py-1 rounded">Awaiting Owner action</p></div>
                                    </div>
                                </div>
                                <button onClick={() => setActiveTab('order')} className="w-full bg-victorian/95 backdrop-blur-xl text-antique border border-antique/30 font-bold py-5 rounded-2xl shadow-elegant hover:bg-victorian transition-all uppercase tracking-widest text-sm flex items-center justify-center gap-2 mt-8"><span className="text-xl font-light leading-none">+</span> Draft BrewOps Order</button>
                            </div>
                        )}

                        {activeTab === 'order' && receivingPO && (
                            <div className="animate-fade-in bg-white/80 backdrop-blur-xl p-5 rounded-2xl shadow-elegant border border-white/40">
                                <div className="flex justify-between items-center mb-5 border-b border-gray-200/50 pb-3"><h2 className="text-xl font-serif font-bold text-victorian">Delivery Intake</h2><button onClick={() => setReceivingPO(null)} className="text-danger font-bold text-xs uppercase tracking-wider hover:bg-danger/10 px-3 py-1.5 rounded-lg transition-colors">Cancel</button></div>
                                <div className="mb-6 bg-paper/60 p-4 rounded-xl border border-white/50 shadow-sm"><p className="text-[10px] text-gray-500 uppercase tracking-widest mb-1">BrewOps Order Reference</p><p className="font-bold text-victorian text-lg mb-4">{receivingPO.id}</p><div className="relative"><input type="file" accept="image/*" multiple id="invoice-upload" className="hidden" onChange={handleRealAIScan} /><label htmlFor="invoice-upload" className={`w-full flex justify-center items-center py-3.5 border rounded-xl text-xs font-bold uppercase tracking-widest cursor-pointer transition-all ${isScanning ? 'bg-antiqueLight/30 border-antique text-victorian shadow-inner' : 'bg-white border-victorian/20 text-victorian hover:border-victorian shadow-sm hover:shadow-md'}`}>{isScanning ? <span className="animate-pulse flex items-center">⏳ Processor Running...</span> : <span className="flex items-center gap-2"><Icons.Camera/> Auto-Scan Invoice</span>}</label></div></div>
                                <div className="mb-6 space-y-3">
                                    <div className="flex justify-between text-[10px] font-bold text-gray-400 uppercase tracking-widest pb-2 border-b border-gray-200 space-x-2"><span className="w-2/5">Item Name</span><span className="w-1/5 text-center">Ord</span><span className="w-1/5 text-center">Rec</span><span className="w-1/5 text-center">Inv (₹)</span></div>
                                    {(receivingPO.items || []).map((item, idx) => (
                                        <div key={idx} className="flex flex-col py-2 border-b border-gray-100 last:border-0 pb-3"><div className="flex justify-between items-center space-x-2"><span className="text-xs w-2/5 pr-1 font-medium text-gray-800 leading-tight">{item.name}</span><span className="text-xs text-center w-1/5 text-gray-500 font-medium leading-tight">{item.qty}<br/><span className="text-[9px]">{item.unit}</span></span><input type="number" min="0" step="any" className="w-1/5 border border-gray-200 rounded-lg p-2 text-center font-bold text-sm bg-white" value={receivedQuantities[idx] || ''} onChange={(e) => setReceivedQuantities({...receivedQuantities, [idx]: e.target.value})} /><input type="number" min="0" step="any" placeholder="₹" className="w-1/5 border border-antique/50 rounded-lg p-2 text-center font-bold text-sm bg-white" value={receivedPrices[idx] || ''} onChange={(e) => setReceivedPrices({...receivedPrices, [idx]: e.target.value})} /></div>
                                            {unmatchedScans.length > 0 && (!receivedQuantities[idx] && !receivedPrices[idx]) && (<div className="mt-2 w-full"><select className="w-full text-[10px] border border-dashed border-antique bg-antiqueLight/20 text-victorian p-2 font-bold uppercase tracking-widest rounded-lg focus:outline-none" value="" onChange={(e) => { const scanObj = unmatchedScans.find(u => u.name === e.target.value); if(scanObj){ setReceivedQuantities({...receivedQuantities, [idx]: scanObj.quantity}); setReceivedPrices({...receivedPrices, [idx]: scanObj.totalPrice}); setUnmatchedScans(unmatchedScans.filter(u => u.name !== e.target.value)); db.collection('settings').doc('main').update({[`aliases.${e.target.value}`]: item.name}); showToast("Mapped!", "success"); } }}><option value="">🔗 Map item...</option>{unmatchedScans.map((u, ui) => (<option key={u.name + ui} value={u.name || ''}>{u.name || 'Unknown'} (Qty: {u.quantity || 0}, ₹{u.totalPrice || 0})</option>))}</select></div>)}
                                        </div>
                                    ))}
                                </div>
                                <button onClick={submitReceive} className="w-full bg-victorian text-antique uppercase tracking-widest text-xs font-bold py-4 rounded-xl shadow-md">Confirm BrewOps Delivery</button>
                            </div>
                        )}

                        {activeTab === 'order' && !receivingPO && (
                            <div className="animate-fade-in">
                                {showAddModal && (
                                    <div className="fixed inset-0 bg-victorian/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 animate-fade-in"><div className="bg-paper p-6 rounded-2xl shadow-2xl w-full max-w-sm border border-antique/30"><h3 className="font-serif font-bold text-xl text-victorian mb-1">Add to Request</h3><p className="text-sm text-gray-600 mb-6 truncate">{modalItemName}</p><div className="flex space-x-4 mb-8"><div className="w-1/2"><label className="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2 block">Quantity</label><input type="number" min="0" step="any" value={modalQty} onChange={e=>setModalQty(e.target.value)} className="w-full border border-gray-200 rounded-xl p-3 text-center font-bold text-lg bg-white shadow-inner" placeholder="0" /></div><div className="w-1/2"><label className="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2 block">Unit</label><select value={modalUnit} onChange={e=>setModalUnit(e.target.value)} className="w-full border border-gray-200 rounded-xl p-3 text-lg bg-white font-medium text-gray-700 shadow-sm">{UNITS.map(u => <option key={u} value={u}>{u}</option>)}</select></div></div><div className="flex space-x-3"><button onClick={() => setShowAddModal(false)} className="w-1/2 bg-white border border-gray-200 text-gray-600 font-bold py-3 text-xs uppercase tracking-widest rounded-xl hover:bg-gray-50 transition-colors">Cancel</button><button onClick={confirmAddItem} className="w-1/2 bg-victorian text-antique border border-antique/30 font-bold py-3 text-xs uppercase tracking-widest rounded-xl hover:bg-victorianLight transition-colors shadow-md">Add</button></div></div></div>
                                )}
                                {activePOs.length > 0 && (
                                    <div className="mb-6 bg-white/80 backdrop-blur-xl rounded-2xl p-5 shadow-elegant border border-white/50 animate-alert-flash"><h3 className="text-xs font-bold uppercase tracking-widest text-victorian mb-4 flex items-center"><span className="mr-2 text-lg">⚠️</span> Incoming Deliveries</h3>{activePOs.map(po => (<div key={po.id} className="bg-paper/80 p-4 rounded-xl border border-victorian/10 mb-3 flex justify-between items-center last:mb-0"><div><p className="font-bold text-sm text-victorian mb-0.5">{po.id || 'N/A'}</p><p className="text-xs text-gray-600">{po.supplier || 'Unknown'}</p></div><button onClick={() => openReceiveScreen(po)} className="bg-white border border-victorian/30 text-victorian text-xs font-bold py-2 px-4 rounded-lg hover:border-victorian transition-all uppercase tracking-wider shadow-sm hover:shadow-md flex items-center gap-1.5"><Icons.Camera /> Intake</button></div>))}</div>
                                )}
                                <h2 className="text-xl font-serif font-semibold text-victorian mb-4 shadow-sm backdrop-blur-md inline-block px-3 py-1 rounded-lg bg-white/40">Request BrewOps Inventory</h2>
                                <div className="relative mb-5 shadow-sm"><span className="absolute inset-y-0 left-0 pl-4 flex items-center text-victorian/40 text-lg">⚲</span><input type="text" className="w-full pl-11 p-4 border border-white/50 bg-white/70 backdrop-blur-xl rounded-xl text-sm shadow-sm" placeholder="Search catalog..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)}/></div>
                                {!searchTerm && (
                                    <div className="flex overflow-x-auto space-x-2 mb-6 pb-2 hide-scrollbar">{Object.keys(inventory).sort().map(cat => <button key={cat} onClick={() => setSelectedCategory(cat)} className={`whitespace-nowrap px-4 py-2 text-xs uppercase tracking-wider rounded-lg transition-all shadow-sm ${selectedCategory === cat ? 'bg-victorian text-paper font-bold scale-[1.02]' : 'bg-white/70 backdrop-blur-md text-victorian hover:bg-white font-medium'}`}>{cat.split(' ')[0]}</button>)}</div>
                                )}
                                <div className="bg-white/70 backdrop-blur-xl rounded-2xl shadow-elegant border border-white/50 p-2 mb-8 max-h-[45vh] overflow-y-auto">
                                    {displayedItems.length === 0 ? <p className="text-victorian/50 text-sm text-center py-8 italic">No items found</p> : displayedItems.map((item, i) => (<div key={`${item}-${i}`} className="flex justify-between items-center py-3.5 px-4 border-b border-victorian/5 last:border-0 hover:bg-white/90 rounded-lg transition-colors"><span className="text-sm font-medium text-victorian/90 pr-2">{item}</span><button onClick={() => openAddModal(item)} className="text-antique bg-antiqueLight/20 w-8 h-8 rounded-full flex items-center justify-center text-xl font-light hover:bg-antique hover:text-white transition-colors leading-none shadow-sm">+</button></div>))}
                                </div>
                                {cart.length > 0 && (
                                    <div className="bg-victorian/95 backdrop-blur-xl text-paper rounded-2xl p-6 shadow-elegant mb-6 border-t-4 border-antique">
                                        <div className="flex justify-between items-end mb-5 border-b border-white/10 pb-3"><h3 className="font-serif font-bold text-xl text-antique">Active BrewOps Draft</h3><span className="text-xs uppercase tracking-widest text-gray-400 bg-white/10 px-2.5 py-1 rounded-lg">{cart.length} items</span></div>
                                        <div className="space-y-4 mb-8">{cart.map((item, idx) => (<div key={`cart-${item.name}-${idx}`} className="flex justify-between items-center group"><div className="flex flex-col"><span className="text-sm font-medium">{item.name || 'Unknown'}</span><span className="text-xs text-antique font-bold mt-0.5">{item.qty || 0} {item.unit || ''}</span></div><button onClick={() => removeItem(idx)} className="text-gray-400 hover:text-danger p-2 transition-colors rounded-lg hover:bg-white/5"><Icons.Trash/></button></div>))}</div>
                                        <button onClick={handleSubmit} className="w-full bg-antique text-victorian font-bold py-4 rounded-xl uppercase tracking-widest text-xs hover:bg-antiqueLight transition-all shadow-lg hover:-translate-y-0.5 flex justify-center items-center gap-2"><Icons.Send/> Submit BrewOps Order</button>
                                    </div>
                                )}
                            </div>
                        )}

                        {activeTab === 'recipes' && (
                            <div className="animate-fade-in">
                                <div className="relative mb-5 shadow-sm"><span className="absolute inset-y-0 left-0 pl-4 flex items-center text-victorian/40 text-lg">⚲</span><input type="text" className="w-full pl-11 p-4 border border-white/50 bg-white/70 backdrop-blur-xl rounded-xl text-sm shadow-sm" placeholder="Search the ledger..." value={recipeSearchFilter} onChange={(e) => setRecipeSearchFilter(e.target.value)}/></div>
                                {!recipeSearchFilter && <div className="flex overflow-x-auto space-x-2 mb-6 pb-2 hide-scrollbar">{['All', ...RECIPE_CATEGORIES].map(cat => <button key={cat} onClick={() => setActiveRecipeTab(cat)} className={`whitespace-nowrap px-4 py-2 text-xs uppercase tracking-wider rounded-lg transition-all shadow-sm ${activeRecipeTab === cat ? 'bg-victorian text-paper font-bold scale-[1.02]' : 'bg-white/70 backdrop-blur-md text-victorian hover:bg-white font-medium'}`}>{cat}</button>)}</div>}
                                <div className="bg-white/80 backdrop-blur-xl rounded-2xl shadow-elegant border border-brandBrown/20 overflow-hidden mb-10">
                                    {displayedRecipes.length === 0 ? <p className="text-center text-sm italic text-gray-500 py-8">No recipes found.</p> :
                                        displayedRecipes.map((recipe, idx) => (
                                            <div key={recipe.id || idx} onClick={() => setViewingRecipe(recipe)} className="flex justify-between items-center p-5 border-b border-brandBrown/10 last:border-0 hover:bg-white/90 cursor-pointer transition-colors group"><div className="flex flex-col"><span className="font-serif font-bold text-lg text-victorian group-hover:text-brandBrown transition-colors">{recipe.name || 'Unknown'}</span><span className="text-[10px] font-bold text-gray-500 uppercase tracking-widest mt-1 bg-gray-100 w-max px-2 py-0.5 rounded">{recipe.category || 'Beverages'}</span></div><span className="text-brandBrown text-xl opacity-50 group-hover:opacity-100 transition-opacity">→</span></div>
                                        ))
                                    }
                                </div>
                                {viewingRecipe && (
                                    <div className="fixed inset-0 bg-victorian/80 backdrop-blur-sm flex items-center justify-center p-4 z-[60] animate-fade-in"><div className="bg-paper p-0 rounded-2xl shadow-2xl w-full max-w-lg border-2 border-brandBrown/40 max-h-[90vh] overflow-y-auto relative"><button onClick={() => setViewingRecipe(null)} className="absolute top-4 right-4 text-gray-500 hover:text-danger bg-white rounded-full p-2 shadow-sm z-10"><Icons.Close/></button><div className="p-6"><div className="flex flex-col mb-5 pr-10 border-b border-victorian/10 pb-4"><h3 className="font-serif font-bold text-victorian text-2xl leading-tight">{viewingRecipe.name || 'Unknown'}</h3><div className="flex gap-2 mt-2.5"><span className="text-[9px] uppercase font-bold tracking-[0.2em] bg-white/70 text-gray-600 border border-gray-200 px-2.5 py-1 rounded-lg shadow-sm">{viewingRecipe.category || 'Beverages'}</span></div></div><div className="bg-white/80 p-4 rounded-xl border border-white/60 shadow-sm mb-5"><p className="text-[10px] font-bold text-gray-500 uppercase tracking-[0.2em] mb-3">Ingredients</p><ul className="text-sm space-y-2.5">{(viewingRecipe.ingredients || []).map((ing, i) => (<li key={i} className="flex justify-between items-end border-b border-gray-100 pb-1.5"><span className="font-medium text-victorian/80">{ing.name || 'Unknown'} {ing.isCustom && <span className="text-[10px] text-gray-400 font-normal ml-1 italic">(Custom)</span>}</span><span className="font-bold text-victorian">{ing.qty || 0} {ing.unit || ''}</span></li>))}</ul></div><p className="text-[10px] font-bold text-gray-500 uppercase tracking-[0.2em] mb-2 pl-1">Method & Notes</p><div className="text-sm text-gray-800 whitespace-pre-wrap leading-relaxed border-l-2 border-antique pl-4 py-2 bg-white/40 rounded-r-lg">{viewingRecipe.instructions || "Standard preparation."}</div></div></div></div>
                                )}
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<React.Fragment><App /></React.Fragment>);
    </script>
</body>
</html>
