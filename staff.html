<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrewOps - Staff Terminal</title>

    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://unpkg.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src https://*.googleapis.com https://*.cloudfunctions.net https://*.firebaseio.com wss://*.firebaseio.com; base-uri 'self'; form-action 'none'; object-src 'none'">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#132A1B">

    <!-- Must load first and must be same-origin: this is what reports a
         failure when one of the CDN scripts below never arrives. -->
    <script src="assets/tcm-boot.js"></script>

    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <!-- Shared theme. staff.html previously declared its own cut-down Tailwind
         config that was missing vintageGreen, victorianLight, paperDark,
         brandLightBrown, dangerLight, shadow-elegant and animate-alert-flash —
         all of which this page uses, so those styles silently did nothing. -->
    <script src="assets/tcm-theme.js"></script>

    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"
            integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z"
            crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"
            integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1"
            crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"
            integrity="sha384-sw98ksifz4z7bpf5bssQYm0RlqkUsNXcYh7KqhO3+SIrvf3+mf0kQRNxaCWcgzjG"
            crossorigin="anonymous"></script>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"
            integrity="sha384-ajMUFBUFMCyjh8uxJg6bkGcKe9RTolyjwbxB3yES0QQMenP3Oztj/W9vA2SJPcIh"
            crossorigin="anonymous"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"
            integrity="sha384-xD1t9dGSVKobUztxDkv6xUI0H4AnFz0NxwlgDJJ7FDlblG9xxr1Z9iauCZuJYj6p"
            crossorigin="anonymous"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"
            integrity="sha384-XMIl1b2Ez9tKAM0R5q67/iLdfnlLBl9kfo40X5WMtCPb+3OLplrjnOxZTYCg1SKY"
            crossorigin="anonymous"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-functions-compat.js"
            integrity="sha384-Cn425IPPqYFT0+lUg71+39dOh8zj/Ebpl97FkjUqrd+P37HLlysOYDvdw+N7tPuj"
            crossorigin="anonymous"></script>

    <script src="assets/tcm-core.js"></script>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="assets/favicon.png">

    <style>
        body { background-color: #FAF8F5; color: #132A1B; font-family: 'Inter', sans-serif; margin: 0; }
        .hide-scrollbar::-webkit-scrollbar { display: none; } .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        /* 131 KB derivative in place of the 13 MB original. */
        .bg-theme-orders { background-image: linear-gradient(rgba(250, 248, 245, 0.35), rgba(250, 248, 245, 0.35)), url('assets/bg-dashboard.jpg'); background-size: cover; background-attachment: fixed; background-position: center; }
        @media (hover: none) { .bg-theme-orders { background-attachment: scroll; } }
        @keyframes slide-up { 0% { transform: translateY(100%); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } } .animate-slide-up { animation: slide-up 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fade-in { 0% { opacity: 0; } 100% { opacity: 1; } } .animate-fade-in { animation: fade-in 0.3s ease-in-out; }
    </style>
</head>
<body>
    <div id="auth-gate" class="min-h-screen flex items-center justify-center font-serif text-victorian bg-paper">
        <p class="animate-pulse font-bold tracking-widest uppercase text-sm">Verifying terminal…</p>
    </div>
    <div id="root" hidden></div>

    <script type="text/babel" data-presets="react">
        /** @jsx React.createElement */
        /** @jsxFrag React.Fragment */

        const { useState, useEffect } = React;

        const { db } = TCM;

        const UNITS = TCM.UNITS;
        const RECIPE_CATEGORIES = ["Beverages","Kitchen","Desserts","Batch Prep"];

        const Icons = {
            Trash: ()=><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>,
            Camera: ()=><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>,
            Check: ()=><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>,
            Menu: ()=><svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>,
            Close: ()=><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>,
            Send: ()=><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>,
            Box: ()=><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>,
            FileText: ()=><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
        };

        const compressImage = TCM.compressImage;

        function App() {
            const [loading, setLoading] = useState(true);
            const [activeTab, setActiveTab] = useState('dashboard');
            const [isSidebarOpen, setSidebarOpen] = useState(false);
            
            const [inventory, setInventory] = useState({});
            const [requests, setRequests] = useState([]);
            const [pos, setPos] = useState([]);
            const [recipes, setRecipes] = useState([]);
            const [aliases, setAliases] = useState({});
            const [ownerPhone, setOwnerPhone] = useState('');
            
            const [toast, setToast] = useState(null);
            
            const [cart, setCart] = useState([]); 
            const [selectedCategory, setSelectedCategory] = useState(''); 
            const [searchTerm, setSearchTerm] = useState('');
            
            const [receivingPO, setReceivingPO] = useState(null); 
            const [receivedQuantities, setReceivedQuantities] = useState({}); 
            const [receivedPrices, setReceivedPrices] = useState({}); 
            const [unmatchedScans, setUnmatchedScans] = useState([]); 
            const [isScanning, setIsScanning] = useState(false);
            
            const [recipeSearchFilter, setRecipeSearchFilter] = useState(''); 
            const [activeRecipeTab, setActiveRecipeTab] = useState('All');
            const [viewingRecipe, setViewingRecipe] = useState(null);

            // Who is signed in — used to stamp requests, receipts and recipes so
            // the owner can see who did what.
            const [me, setMe] = useState({ name: '', uid: '' });

            // Recipe authoring. Staff may ADD to the book but never edit it, so
            // there is no edit path here at all — the Firestore rules refuse an
            // update from a staff token regardless of what the UI offers.
            const [isBuilding, setIsBuilding] = useState(false);
            const [savingRecipe, setSavingRecipe] = useState(false);
            const [rName, setRName] = useState('');
            const [rCat, setRCat] = useState(RECIPE_CATEGORIES[0]);
            const [rYieldQty, setRYieldQty] = useState('');
            const [rYieldUnit, setRYieldUnit] = useState('ml');
            const [rInstructions, setRInstructions] = useState('');
            const [rCart, setRCart] = useState([]);
            const [ingSearch, setIngSearch] = useState('');
            const [showIngModal, setShowIngModal] = useState(false);
            const [ingName, setIngName] = useState('');
            const [ingQty, setIngQty] = useState('');
            const [ingUnit, setIngUnit] = useState('gms');
            const [ingCustom, setIngCustom] = useState(false);

            const [showAddModal, setShowAddModal] = useState(false); 
            const [modalItemName, setModalItemName] = useState(''); 
            const [modalQty, setModalQty] = useState(''); 
            const [modalUnit, setModalUnit] = useState('Kg');

            const showToast = (message, type = 'info') => { setToast({ message, type }); setTimeout(() => setToast(null), 3500); };

            // Writes the whole aliases map rather than a dotted field path.
            // The previous `update({ ['aliases.' + scannedName]: item })` broke
            // whenever a scanned invoice line contained a dot ("AMUL BUTTER
            // 500G PKT.") — Firestore reads that as a nested path and buries the
            // alias one level deeper, so the mapping never matched again. Names
            // containing / ~ * [ ] were rejected outright.
            const saveAlias = (scannedName, catalogueName) => {
                const next = { ...aliases, [scannedName]: catalogueName };
                setAliases(next);
                db.collection('settings').doc('main').update({ aliases: next })
                    .catch(err => { console.error(err); showToast("Mapping could not be saved.", "error"); });
            };

            // Subscribe exactly once. This used to depend on [selectedCategory],
            // so every tap on a category tab tore down and re-opened all four
            // Firestore listeners — re-reading the entire catalogue, request
            // list, PO list and recipe book each time, and billing for it.
            // The default category is now chosen with a functional update, which
            // removes the need for the dependency.
            useEffect(() => {
                const settingsRef = db.collection('settings').doc('main');
                const onError = (label) => (err) => {
                    console.error(err);
                    showToast(`Lost connection to ${label}.`, 'error');
                    setLoading(false);
                };

                const unsubSettings = settingsRef.onSnapshot(doc => {
                    if (doc.exists) {
                        const data = doc.data();
                        const rawInv = data.inventory || {};
                        const scrubbedInv = {};
                        Object.keys(rawInv).forEach(key => { scrubbedInv[key] = [...new Set(rawInv[key])]; });
                        setInventory(scrubbedInv);
                        setSelectedCategory(prev => prev || Object.keys(scrubbedInv).sort()[0] || '');
                        setAliases(data.aliases || {});
                        setOwnerPhone(data.ownerPhone || '');
                    }
                    // Only stop showing the loader once real data has arrived.
                    setLoading(false);
                }, onError('settings'));

                const unsubReqs = db.collection('requests').onSnapshot(snap => {
                    const reqData = []; snap.forEach(d => reqData.push(d.data())); setRequests(reqData);
                }, onError('requests'));

                const unsubPOs = db.collection('pos').onSnapshot(snap => {
                    const poData = []; snap.forEach(d => poData.push(d.data())); setPos(poData);
                }, onError('purchase orders'));

                const unsubRecipes = db.collection('recipes').onSnapshot(snap => {
                    const recData = []; snap.forEach(d => recData.push(d.data()));
                    setRecipes(recData.sort((a,b) => String(a.name || '').localeCompare(String(b.name || ''))));
                }, onError('the recipe book'));

                // Own team record. The rules allow reading only the document
                // whose uid matches the caller, so this cannot enumerate staff.
                const user = TCM.auth.currentUser;
                if (user) {
                    const key = TCM.phoneKey(user.phoneNumber || '');
                    if (key) {
                        db.collection('staffMembers').doc(key).get()
                            .then(d => { if (d.exists) setMe({ name: d.data().name || '', uid: user.uid }); })
                            .catch(() => setMe({ name: '', uid: user.uid }));
                    } else {
                        setMe({ name: '', uid: user.uid });
                    }
                }

                return () => { unsubSettings(); unsubReqs(); unsubPOs(); unsubRecipes(); };
            }, []);

            const resetRecipeForm = () => {
                setRName(''); setRCat(RECIPE_CATEGORIES[0]); setRYieldQty('');
                setRYieldUnit('ml'); setRInstructions(''); setRCart([]); setIngSearch('');
            };

            const saveRecipe = async () => {
                if (!rName.trim()) return showToast('Give the recipe a name.', 'error');
                if (rCart.length === 0) return showToast('Add at least one ingredient.', 'error');
                if (rCat === 'Batch Prep' && !(Number(rYieldQty) > 0)) {
                    return showToast('A batch prep needs a yield quantity.', 'error');
                }
                if (recipes.some(r => (r.name || '').toLowerCase() === rName.trim().toLowerCase())) {
                    return showToast('A recipe with that name already exists.', 'error');
                }

                const uid = TCM.auth.currentUser ? TCM.auth.currentUser.uid : '';
                const id = 'REC-' + Date.now().toString(36).toUpperCase() + '-' + Math.floor(Math.random() * 4096).toString(36).toUpperCase();

                setSavingRecipe(true);
                try {
                    await db.collection('recipes').doc(id).set({
                        id,
                        name: rName.trim(),
                        category: rCat,
                        yieldQty: rCat === 'Batch Prep' ? Number(rYieldQty) : null,
                        yieldUnit: rCat === 'Batch Prep' ? rYieldUnit : null,
                        instructions: rInstructions.trim(),
                        ingredients: rCart,
                        date: TCM.today(),
                        createdAt: new Date().toISOString(),
                        // Required by the security rules: a staff member may only
                        // create a recipe stamped with their own uid.
                        createdBy: uid,
                        createdByName: me.name || ''
                    });
                    showToast('Recipe added to the book.', 'success');
                    setIsBuilding(false);
                    resetRecipeForm();
                } catch (err) {
                    console.error(err);
                    showToast('Could not save the recipe.', 'error');
                } finally {
                    setSavingRecipe(false);
                }
            };

            // DRAFTING LOGIC
            const openAddModal = (item) => { if (cart.find(i => i.name === item)) return showToast("Already in cart", "error"); setModalItemName(item); setModalQty(''); setModalUnit('Kg'); setShowAddModal(true); };
            const confirmAddItem = () => { if(!modalQty || Number(modalQty) <= 0) return showToast("Invalid quantity", "error"); setCart([...cart, { name: modalItemName, qty: Number(modalQty), unit: modalUnit }]); setShowAddModal(false); };
            const removeItem = (index) => setCart(cart.filter((_, i) => i !== index));
            
            const [isSubmitting, setIsSubmitting] = useState(false);

            const handleSubmit = async () => {
                if (cart.length === 0) return showToast('Cart is empty', 'error');
                if (isSubmitting) return;
                setIsSubmitting(true);

                // TCM.newRequestId is timestamp-prefixed with a random suffix.
                // The old 'REQ-' + random(1000..9999) had only 9000 possible ids
                // and was written with .set(), so a collision silently replaced
                // an existing request — roughly a coin flip after 100 requests.
                const reqId = TCM.newRequestId();
                const itemList = cart.map((i, index) => `${index + 1}. ${i.name || ''} — ${i.qty || 0} ${i.unit || ''}`).join('\n');

                try {
                    await db.collection('requests').doc(reqId).set({
                        id: reqId,
                        items: cart,
                        date: TCM.today(),
                        createdAt: new Date().toISOString(),
                        createdBy: TCM.auth.currentUser ? TCM.auth.currentUser.uid : '',
                        createdByName: me.name || ''
                    });
                } catch (err) {
                    console.error(err);
                    setIsSubmitting(false);
                    // Keep the cart so the shift's work is not lost on a flaky connection.
                    return showToast('Could not send the request. Your list has been kept — try again.', 'error');
                }

                setCart([]); setSearchTerm(''); setIsSubmitting(false);
                showToast('Master Request sent!', 'success');

                if (ownerPhone) {
                    const message = `*New Master Request: ${reqId}*\n\nHello, the staff has prepared a new order list.\n\n*Items Requested:*\n${itemList}\n\nPlease check the TCM Dashboard.`;
                    window.open('https://wa.me/' + TCM.normalizePhone(ownerPhone) + '?text=' + encodeURIComponent(message), '_blank', 'noopener');
                }
            };

            // SCANNING LOGIC
            const openReceiveScreen = (po) => { setReceivingPO(po); const initialQty = {}; const initialPrices = {}; (po.items || []).forEach((item, idx) => { initialQty[idx] = item.qty || 0; initialPrices[idx] = ''; }); setReceivedQuantities(initialQty); setReceivedPrices(initialPrices); setUnmatchedScans([]); };

            const handleRealAIScan = async (e) => {
                const input = e.target;
                const files = Array.from(input.files || []);
                input.value = ''; // allows re-picking the same photo after a failure
                if (files.length === 0) return;
                if (files.length > TCM.MAX_SCAN_FILES) return showToast(`Scan up to ${TCM.MAX_SCAN_FILES} pages at a time.`, 'error');
                setIsScanning(true);
                try {
                    let allScannedItems = []; const scanInvoice = TCM.fns.httpsCallable('scanInvoice');
                    for (let file of files) { const compressedBase64 = await compressImage(file); const response = await scanInvoice({ image: compressedBase64 }); if (response.data.lineItems) allScannedItems = [...allScannedItems, ...response.data.lineItems]; }
                    const autoQty = { ...receivedQuantities }; const autoPrices = { ...receivedPrices }; const unmatched = []; const usedScans = new Set();
                    (receivingPO.items || []).forEach((poItem, idx) => { let matchIndex = allScannedItems.findIndex((scan, i) => !usedScans.has(i) && aliases[scan.name] === poItem.name); if (matchIndex === -1) matchIndex = allScannedItems.findIndex((scan, i) => !usedScans.has(i) && ((poItem.name || '').toLowerCase().includes((scan.name || '').toLowerCase().split(' ')[0]) || (scan.name || '').toLowerCase().includes((poItem.name || '').toLowerCase().split(' ')[0]))); if (matchIndex !== -1) { const match = allScannedItems[matchIndex]; autoQty[idx] = match.quantity; autoPrices[idx] = match.totalPrice; usedScans.add(matchIndex); } else { autoQty[idx] = ''; autoPrices[idx] = ''; } });
                    allScannedItems.forEach((scan, i) => { if (!usedScans.has(i)) unmatched.push(scan); });
                    setReceivedQuantities(autoQty); setReceivedPrices(autoPrices); setUnmatchedScans(unmatched);
                    if (unmatched.length > 0) showToast(`Mapped partially. Map ${unmatched.length} items below.`, 'info'); else showToast("Perfect Auto-Match!", 'success');
                } catch (error) {
                    console.error(error);
                    if (error && error.code === 'functions/permission-denied') showToast('Not authorised to scan invoices.', 'error');
                    else if (error && error.code === 'functions/not-found') showToast('Invoice scanner is not deployed.', 'error');
                    else showToast(error && error.message ? `Scan failed: ${error.message}` : 'Scan failed.', 'error');
                } finally { setIsScanning(false); }
            };

            const submitReceive = async () => {
                const items = receivingPO.items || [];

                const invalid = items.some((item, idx) => {
                    const q = Number(receivedQuantities[idx]);
                    const p = Number(receivedPrices[idx]);
                    return (receivedQuantities[idx] !== '' && receivedQuantities[idx] !== undefined && (!isFinite(q) || q < 0)) ||
                           (receivedPrices[idx] !== '' && receivedPrices[idx] !== undefined && (!isFinite(p) || p < 0));
                });
                if (invalid) return showToast('Quantities and amounts must be zero or more.', 'error');

                const receivedItemsData = items.map((item, idx) => ({ ...item, receivedQty: Number(receivedQuantities[idx]) || 0, totalPrice: Number(receivedPrices[idx]) || 0 }));

                try {
                    await db.collection('pos').doc(TCM.poDocId(receivingPO.id)).update({
                        status: 'Delivered',
                        receivedItems: receivedItemsData,
                        deliveryDate: TCM.today(),
                        receivedBy: me.name || 'Staff'
                    });
                    setReceivingPO(null);
                    showToast('Intake registered!', 'success');
                } catch (err) {
                    console.error(err);
                    showToast('Could not register the delivery — nothing was saved.', 'error');
                }
            };

            if (loading) return <div className="min-h-screen bg-paper flex items-center justify-center font-serif text-victorian animate-pulse">Loading Staff Terminal...</div>;

            const activePOs = pos.filter(po => po.status === 'Approved');
            const displayedItems = searchTerm.trim() !== '' ? [...new Set(Object.values(inventory).flat())].filter(item => (item || '').toLowerCase().includes(searchTerm.toLowerCase())) : (inventory[selectedCategory] || []);
            const ingredientChoices = [...new Set([
                ...recipes.filter(r => r.category === 'Batch Prep').map(r => r.name),
                ...Object.values(inventory).flat()
            ])].filter(Boolean).sort();
            const displayedRecipes = recipes.filter(r => { const matchesSearch = (r.name || '').toLowerCase().includes(recipeSearchFilter.toLowerCase()); const matchesCat = activeRecipeTab === 'All' || (r.category || 'Beverages') === activeRecipeTab; return matchesSearch && matchesCat; });

            return (
                <div className="min-h-screen pb-24 lg:pb-0 transition-all duration-700 ease-in-out bg-theme-orders relative">
                    {toast && ( <div className="fixed bottom-6 left-1/2 transform -translate-x-1/2 z-[100] animate-slide-up"> <div className={`px-6 py-3 rounded-full shadow-2xl backdrop-blur-md border border-white/20 font-medium text-sm text-white flex items-center space-x-2 ${toast.type === 'error' ? 'bg-danger/90' : 'bg-victorian/90'}`}> <Icons.Check /> <span>{toast.message}</span> </div> </div> )}
                    
                    {isSidebarOpen && <div className="fixed inset-0 bg-black/40 backdrop-blur-sm z-40" onClick={() => setSidebarOpen(false)}></div>}
                    <div className={`fixed inset-y-0 left-0 w-72 bg-victorian text-paper shadow-2xl z-50 transform transition-transform duration-300 ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full'}`}>
                        <div className="flex justify-between items-center p-4 border-b border-white/10 bg-white relative">
                            <div className="w-full flex justify-center items-center py-4"><img src="assets/name.jpg" alt="TCM BrewOps" width="640" height="420" className="h-16 object-contain mix-blend-multiply drop-shadow-sm w-full" /></div>

                                                            setShowIngModal(false);
                                                        }}
                                                        className="w-1/2 bg-victorian text-antique border border-antique/30 font-bold py-3 text-xs uppercase tracking-widest rounded-xl shadow-md">Add</button>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                <div className="relative mb-5 shadow-sm"><span className="absolute inset-y-0 left-0 pl-4 flex items-center text-victorian/40 text-lg">⚲</span><input type="text" className="w-full pl-11 p-4 border border-white/50 bg-white/70 backdrop-blur-xl rounded-xl text-sm shadow-sm" placeholder="Search the ledger..." value={recipeSearchFilter} onChange={(e) => setRecipeSearchFilter(e.target.value)}/></div>
                                {!recipeSearchFilter && <div className="flex overflow-x-auto space-x-2 mb-6 pb-2 hide-scrollbar">{['All', ...RECIPE_CATEGORIES].map(cat => <button key={cat} onClick={() => setActiveRecipeTab(cat)} className={`whitespace-nowrap px-4 py-2 text-xs uppercase tracking-wider rounded-lg transition-all shadow-sm ${activeRecipeTab === cat ? 'bg-victorian text-paper font-bold scale-[1.02]' : 'bg-white/70 backdrop-blur-md text-victorian hover:bg-white font-medium'}`}>{cat}</button>)}</div>}
                                <div className="bg-white/80 backdrop-blur-xl rounded-2xl shadow-elegant border border-brandBrown/20 overflow-hidden mb-10">
                                    {displayedRecipes.length === 0 ? <p className="text-center text-sm italic text-gray-500 py-8">No recipes found.</p> :
                                        displayedRecipes.map((recipe, idx) => (
                                            <div key={recipe.id || idx} onClick={() => setViewingRecipe(recipe)} className="flex justify-between items-center p-5 border-b border-brandBrown/10 last:border-0 hover:bg-white/90 cursor-pointer transition-colors group"><div className="flex flex-col"><span className="font-serif font-bold text-lg text-victorian group-hover:text-brandBrown transition-colors">{recipe.name || 'Unknown'}</span><span className="text-[10px] font-bold text-gray-500 uppercase tracking-widest mt-1 bg-gray-100 w-max px-2 py-0.5 rounded">{recipe.category || 'Beverages'}</span></div><span className="text-brandBrown text-xl opacity-50 group-hover:opacity-100 transition-opacity">→</span></div>
                                        ))
                                    }
                                </div>
                                {viewingRecipe && (
                                    <div className="fixed inset-0 bg-victorian/80 backdrop-blur-sm flex items-center justify-center p-4 z-[60] animate-fade-in"><div className="bg-paper p-0 rounded-2xl shadow-2xl w-full max-w-lg border-2 border-brandBrown/40 max-h-[90vh] overflow-y-auto relative"><button onClick={() => setViewingRecipe(null)} className="absolute top-4 right-4 text-gray-500 hover:text-danger bg-white rounded-full p-2 shadow-sm z-10"><Icons.Close/></button><div className="p-6"><div className="flex flex-col mb-5 pr-10 border-b border-victorian/10 pb-4"><h3 className="font-serif font-bold text-victorian text-2xl leading-tight">{viewingRecipe.name || 'Unknown'}</h3><div className="flex gap-2 mt-2.5"><span className="text-[9px] uppercase font-bold tracking-[0.2em] bg-white/70 text-gray-600 border border-gray-200 px-2.5 py-1 rounded-lg shadow-sm">{viewingRecipe.category || 'Beverages'}</span>{viewingRecipe.createdByName && <span className="text-[9px] uppercase font-bold tracking-[0.2em] bg-vintageGreen/10 text-vintageGreen border border-vintageGreen/30 px-2.5 py-1 rounded-lg shadow-sm">Added by {viewingRecipe.createdByName}</span>}</div></div><div className="bg-white/80 p-4 rounded-xl border border-white/60 shadow-sm mb-5"><p className="text-[10px] font-bold text-gray-500 uppercase tracking-[0.2em] mb-3">Ingredients</p><ul className="text-sm space-y-2.5">{(viewingRecipe.ingredients || []).map((ing, i) => (<li key={i} className="flex justify-between items-end border-b border-gray-100 pb-1.5"><span className="font-medium text-victorian/80">{ing.name || 'Unknown'} {ing.isCustom && <span className="text-[10px] text-gray-400 font-normal ml-1 italic">(Custom)</span>}</span><span className="font-bold text-victorian">{ing.qty || 0} {ing.unit || ''}</span></li>))}</ul></div><p className="text-[10px] font-bold text-gray-500 uppercase tracking-[0.2em] mb-2 pl-1">Method & Notes</p><div className="text-sm text-gray-800 whitespace-pre-wrap leading-relaxed border-l-2 border-antique pl-4 py-2 bg-white/40 rounded-r-lg">{viewingRecipe.instructions || "Standard preparation."}</div></div></div></div>
                                )}
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        // 'staff' is the minimum role; TCM.guard also admits an owner, so the
        // owner can use the staff terminal without a second PIN. A visitor with
        // no session is redirected to the login page and this never runs.
        TCM.guard('staff').then(() => {
            document.getElementById('auth-gate').remove();
            const rootEl = document.getElementById('root');
            rootEl.hidden = false;
            ReactDOM.createRoot(rootEl).render(<React.Fragment><App /></React.Fragment>);
            TCM.registerServiceWorker();
        });
    </script>
</body>
</html>
