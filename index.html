<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCM BrewOps - Security Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" href="TCM BrewOps icon.jpg?v=3">
    <script>
        tailwind.config = { theme: { extend: { colors: { brandBrown: '#8b5e3c', antique: '#D4AF37', victorian: '#132A1B' }, fontFamily: { poppins: ['"Poppins"', 'sans-serif'] } } } }
    </script>
    <style>
        body { background-color: #FAF8F5; margin: 0; }
        .bg-theme { background-image: url('DSC_8010.jpg'); background-size: cover; background-position: center; }
        .bg-card { background-image: url('Login Tab.jpg'); background-size: cover; background-position: center; }
    </style>
</head>
<body>
    <div class="min-h-screen flex justify-center items-center relative bg-[#FAF8F5]">
        <div class="absolute inset-0 bg-theme opacity-55 pointer-events-none z-0"></div>
        <div class="relative z-10 w-[90%] max-w-[380px] h-[600px] sm:h-[680px] rounded-[30px] shadow-[0_20px_50px_rgba(0,0,0,0.2)] overflow-hidden flex flex-col bg-white bg-card mt-10">
            <div class="flex-1 flex flex-col justify-end px-8 pb-20 sm:pb-28">
                <form id="loginForm">
                    <div class="mb-5">
                        <input type="password" id="pinInput" autofocus placeholder="••••••" class="w-full p-4 rounded-xl border-2 border-antique/80 outline-none focus:border-brandBrown focus:ring-2 focus:ring-brandBrown/20 transition-all text-center text-3xl tracking-[0.6em] font-mono bg-transparent text-victorian" />
                    </div>
                    <button type="submit" class="w-full p-4 border-none rounded-xl bg-brandBrown hover:bg-[#c08a5b] text-white font-poppins text-[15px] font-bold uppercase tracking-widest cursor-pointer transition-all shadow-md">Login</button>
                    <p id="errorMsg" class="text-red-600 text-center mt-3 text-xs font-bold uppercase tracking-widest hidden">Terminal Denied</p>
                </form>
                <div class="mt-6 text-[10px] text-gray-500 font-medium tracking-wide text-center">Internal Security Protocol</div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const pin = document.getElementById('pinInput').value;
            if (pin === '170117') {
                window.location.href = 'owner.html';
            } else if (pin === '1234') {
                window.location.href = 'staff.html';
            } else {
                document.getElementById('errorMsg').classList.remove('hidden');
                document.getElementById('pinInput').value = '';
            }
        });
    </script>
</body>
</html>
