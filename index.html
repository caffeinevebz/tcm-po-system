<!DOCTYPE html>
<html lang="en">

    <title>TCM BrewOps - Inventory & Recipe Management</title>

        tailwind.config = {

                        'login': '0 15px 40px rgba(0,0,0,0.1)',
                        'vintage': '0 10px 30px rgba(44, 26, 15, 0.08)',

    <style>
        body { background-color: #FAF8F5; color: #132A1B; font-family: 'Inter', sans-serif; margin: 0; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        input[type="text"], input[type="number"], input[type="password"], select, textarea { transition: all 0.2s ease-in-out; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #D4AF37 !important; box-shadow: 0 0 0 1px #D4AF37 !important; }
        .bg-theme-orders { background-image: linear-gradient(rgba(250, 248, 245, 0.35), rgba(250, 248, 245, 0.35)), url('DSC_8017.jpg'); background-size: cover; background-attachment: fixed; background-position: center; }
        .vintage-checkbox { appearance: none; width: 20px; height: 20px; border: 2px solid #8b5e3c; border-radius: 4px; background-color: #FAF8F5; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; }
        .vintage-checkbox:checked { background-color: #FAF8F5; border-color: #4A5D23; }
        .vintage-checkbox:checked::before { content: '✔'; color: #4A5D23; font-size: 14px; font-weight: bold; }
        @keyframes slide-up { 0% { transform: translateY(100%); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
        .animate-slide-up { animation: slide-up 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fade-in { 0% { opacity: 0; } 100% { opacity: 1; } }
        .animate-fade-in { animation: fade-in 0.3s ease-in-out; }

</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- FIREBASE APP CONFIG ENGINE ---
        const firebaseConfig = {
            apiKey: "AIzaSyAcE76Pc46oOJ3FMqb4kcojbvq5ACPuwaE",
            authDomain: "tcm-orders.firebaseapp.com",
            projectId: "tcm-orders",
            storageBucket: "tcm-orders.firebasestorage.app",
            messagingSenderId: "994764639663",
            appId: "1:994764639663:web:2b0a682f2cb1001d37335a"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const functions = firebase.functions();

        const DEFAULT_SUPPLIERS = [ { "name": "Rare Beans Company", "phone": "8619122260" }, { "name": "Aditya Industries", "phone": "9595711611" }, { "name": "Renu Devi & Sons", "phone": "7737840411" }, { "name": "Cash Purchase", "phone": "" } ];
        const DEFAULT_INVENTORY = {
            "Fruits and Vegetables": ["Apple (सेव)", "Avocado (अवोकेडो)", "Banana (केले)", "Broccoli (ब्रोकली)", "Tomato (टमाटर)", "Garlic (लहसुन)", "Onion (प्याज़)"],
            "Coffee and Matcha": ["Full House Green (Arabica)", "Baarbara Green (Cold Brew)", "Matcha (Premium)"],
            "Groceries": ["Aata", "Amul Butter", "Amul Cheese", "Sugar", "Milk (Full Cream)", "Olive Oil"],
            "Packing and Consumables": ["Brown Paper Bag", "Hot coffee cup", "Pizza Boxes"]
        };
        const UNITS = ["Kg", "gms", "Piece", "Pkt", "Jar", "Carton", "Tin", "bunch", "Ltr", "ml", "tsp", "tbsp", "Bottle"];
        const RECIPE_CATEGORIES = ["Beverages", "Kitchen", "Desserts", "Batch Prep"]; 

        const Icons = {
            Trash: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>,
            Edit: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>,
            Send: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>,
            Camera: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>,
            Check: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>,
            Menu: () => <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>,
            Close: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>,
            Activity: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>,
            Box: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>,
            FileText: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>,
            Users: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
        };

        // --- APPSHEET EMULATION WORKSPACE BAR ---
        const DashboardLayout = ({ role, onLogout, activeTab, setActiveTab, children }) => {
            const [isSidebarOpen, setSidebarOpen] = useState(false);
            const menuItems = role === 'owner' ? 
                [{ id: 'dashboard', label: 'Welcome Dashboard' }, { id: 'orders', label: 'Manage Orders & POs' }, { id: 'recipes', label: 'Kitchen Recipe Book' }, { id: 'conversions', label: 'Prep Kitchen Engine' }, { id: 'vendors', label: 'Vendor Directory' }, { id: 'inventory', label: 'Raw Material Master' }, { id: 'workbench', label: "Brewster's Workbench" }] :
                [{ id: 'dashboard', label: 'Dashboard' }, { id: 'order', label: 'Draft BrewOps Order' }, { id: 'recipes', label: 'Recipe Book' }];

            return (
                <div className="min-h-screen pb-24 lg:pb-0 transition-all duration-700 ease-in-out bg-theme-orders relative">
                    {isSidebarOpen && <div className="fixed inset-0 bg-black/40 backdrop-blur-sm z-40 transition-opacity" onClick={() => setSidebarOpen(false)}></div>}
                    <div className={`fixed inset-y-0 left-0 w-72 bg-victorian text-paper shadow-2xl z-50 transform transition-transform duration-300 ease-in-out ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full'}`}>
                        <div className="flex justify-between items-center p-4 border-b border-white/10 relative bg-white">
                            <div className="w-full flex justify-center items-center py-4 px-2">
                                <img src="Name.jpg" alt="The Caffeine Ministry" className="h-16 sm:h-20 object-contain mix-blend-multiply drop-shadow-sm w-full" />
                            </div>
                            <button onClick={() => setSidebarOpen(false)} className="text-victorian hover:text-brandBrown absolute right-3 top-3 bg-white/80 rounded-full p-1 shadow-sm"><Icons.Close/></button>
                        </div>
                        <div className="p-4 space-y-2 flex flex-col h-[calc(100vh-120px)] overflow-y-auto hide-scrollbar">
                            <div className="flex-1 space-y-2 mt-4">
                                <p className="text-[10px] text-gray-500 uppercase tracking-widest font-bold px-4 mb-4">{role} Navigation</p>
                                {menuItems.map(item => (
                                    <button key={item.id} onClick={() => { setActiveTab(item.id); setSidebarOpen(false); }} className={`w-full text-left px-4 py-3.5 font-bold text-xs uppercase tracking-widest rounded-xl transition-all ${activeTab === item.id ? 'bg-brandBrown text-white shadow-md' : 'text-gray-300 hover:bg-white/10 hover:text-white'}`}>{item.label}</button>
                                ))}
                            </div>
                            <button onClick={onLogout} className="w-full text-left px-4 py-3.5 font-bold text-xs uppercase tracking-widest rounded-xl text-dangerLight hover:bg-danger/20 transition-all mt-6">Log Out</button>
                        </div>
                    </div>
                    <header className="bg-gradient-to-r from-[#e8dfd1] to-[#FAF8F5] border-b-2 border-brandBrown/30 px-4 py-3 shadow-md sticky top-0 z-30">
                        <div className="flex items-center justify-between max-w-6xl mx-auto relative">
                            <button onClick={() => setSidebarOpen(true)} className="text-victorian hover:text-brandBrown transition-colors p-2 rounded-lg hover:bg-black/5"><Icons.Menu/></button>
                            <div className="flex-1 flex justify-center py-1">
                                <img src="Page-Header.jpg" alt="The Caffeine Ministry" className="h-12 sm:h-16 md:h-20 lg:h-24 object-contain mix-blend-multiply drop-shadow-sm" />
                            </div>
                            <div className="w-12"></div>
                        </div>
                    </header>
                    <main className="max-w-6xl mx-auto mt-6 px-4 lg:px-6">{children}</main>
                </div>
            );
        };

        function App() {
            const [role, setRole] = useState(null); const [loading, setLoading] = useState(true);
            const [staffTab, setStaffTab] = useState('dashboard'); const [ownerTab, setOwnerTab] = useState('dashboard'); 
            const [requests, setRequests] = useState([]); const [pos, setPos] = useState([]); const [poCounter, setPoCounter] = useState({ month: '', count: 1 });
            const [suppliers, setSuppliers] = useState([]); const [inventory, setInventory] = useState(DEFAULT_INVENTORY);
            const [prepItems, setPrepItems] = useState([]); const [ownerPhone, setOwnerPhone] = useState('');
            const [recipes, setRecipes] = useState([]); const [prices, setPrices] = useState({}); const [aliases, setAliases] = useState({});
            const [toast, setToast] = useState(null); const [confirmDialog, setConfirmDialog] = useState(null);

            const showToast = (message, type = 'info') => { setToast({ message, type }); setTimeout(() => setToast(null), 3500); };
            const confirmAction = (message, onConfirm) => { setConfirmDialog({ message, onConfirm: () => { onConfirm(); setConfirmDialog(null); } }); };

            useEffect(() => {
                let unsubSettings = () => {}; let unsubReqs = () => {}; let unsubPOs = () => {}; let unsubRecipes = () => {};
                const initializeDB = async () => {
                    const settingsRef = db.collection('settings').doc('main'); const docSnap = await settingsRef.get();
                    if (!docSnap.exists) {
                        const now = new Date(); const initialMonth = `${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getFullYear()).slice(-2)}`;
                        await settingsRef.set({ suppliers: DEFAULT_SUPPLIERS, inventory: DEFAULT_INVENTORY, prepItems: [], poCounter: { month: initialMonth, count: 1 }, ownerPhone: '', prices: {}, aliases: {} });
                    }
                    unsubSettings = settingsRef.onSnapshot(doc => {
                        if (doc.exists) {
                            const data = doc.data(); const rawInv = data.inventory || DEFAULT_INVENTORY; const scrubbedInv = {};
                            if (rawInv['Amul Milk']) { delete rawInv['Amul Milk']; settingsRef.update({ inventory: rawInv }); }
                            Object.keys(rawInv).forEach(key => { scrubbedInv[key] = [...new Set(rawInv[key])]; });
                            setSuppliers(data.suppliers || DEFAULT_SUPPLIERS); setInventory(scrubbedInv); setPrepItems(data.prepItems || []); setPoCounter(data.poCounter); setOwnerPhone(data.ownerPhone || ''); setPrices(data.prices || {}); setAliases(data.aliases || {});
                        }
                    });
                    unsubReqs = db.collection('requests').onSnapshot(snap => { const reqData = []; snap.forEach(d => reqData.push(d.data())); setRequests(reqData.sort((a,b) => String(b.id || '').localeCompare(String(a.id || '')))); });
                    unsubPOs = db.collection('pos').onSnapshot(snap => { const poData = []; snap.forEach(d => poData.push(d.data())); setPos(poData.sort((a,b) => String(b.id || '').localeCompare(String(a.id || '')))); });
                    unsubRecipes = db.collection('recipes').onSnapshot(snap => { const recData = []; snap.forEach(d => recData.push(d.data())); setRecipes(recData.sort((a,b) => String(a.name || '').localeCompare(String(b.name || '')))); });
                    setLoading(false);
                };
                initializeDB(); return () => { unsubSettings(); unsubReqs(); unsubPOs(); unsubRecipes(); };
            }, []);

            const updateAlias = (rawInvoiceName, dbItemName) => { const newAliases = { ...aliases, [rawInvoiceName]: dbItemName }; setAliases(newAliases); db.collection('settings').doc('main').update({ aliases: newAliases }); };
            
            const convertToCost = (qty, fromUnit, priceObj) => {
                if (!priceObj || !priceObj.price || isNaN(priceObj.price)) return { base: 0, landed: 0 };
                let factor = 1; const pUnit = priceObj.unit || '';
                if (fromUnit === 'ml' && pUnit === 'Ltr') factor = 0.001; if (fromUnit === 'Ltr' && pUnit === 'ml') factor = 1000;
                if (fromUnit === 'gms' && pUnit === 'Kg') factor = 0.001; if (fromUnit === 'Kg' && pUnit === 'gms') factor = 1000;
                const baseCost = (Number(qty) * factor) * Number(priceObj.price); const gst = Number(priceObj.gst) || 0;
                return { base: baseCost, landed: baseCost * (1 + (gst / 100)) };
            };

            const generatePONumber = () => {
                const now = new Date(); const currentMonthYear = `${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getFullYear()).slice(-2)}`;
                let newCount = poCounter.count || 1; if (poCounter.month !== currentMonthYear) { newCount = 1; }
                const paddedCount = String(newCount).padStart(3, '0'); db.collection('settings').doc('main').update({ poCounter: { month: currentMonthYear, count: newCount + 1 } });
                return `TCM/${currentMonthYear}/${paddedCount}`;
            };

            const submitMasterRequest = (items) => {
                const reqId = 'REQ-' + Math.floor(1000 + Math.random() * 9000); db.collection('requests').doc(reqId).set({ id: reqId, items, date: new Date().toLocaleDateString('en-GB') });
                if (ownerPhone && ownerPhone.trim() !== '') {
                    const itemList = items.map((i, index) => `${index + 1}. ${i.name || ''} — ${i.qty || 0} ${i.unit || ''}`).join('\n');
                    const message = `*New Master Request: ${reqId}*\n\nHello, the staff has prepared a new order list.\n\n*Items Requested:*\n${itemList}\n\nPlease check the TCM Dashboard.`;
                    let phoneStr = ownerPhone.replace(/\D/g, ''); if (phoneStr.length === 10) phoneStr = '91' + phoneStr; 
                    window.open('https://wa.me/' + phoneStr + '?text=' + encodeURIComponent(message), '_blank');
                } else showToast('Master Request sent to database!', 'success');
            };

            const sendWhatsApp = (po, isAmendment = false, customPhones = null) => {
                if(po.supplier === "Cash Purchase") return showToast("Internal Cash Purchase PO generated.", "info");
                const itemList = (po.items || []).map((i, index) => `${index + 1}. ${i.name || ''} — ${i.qty || 0} ${i.unit || ''}`).join('\n');
                let prefix = po.status === 'Delivered' ? `*[RESENT FOR RECORDS]*\n` : (isAmendment ? `*[AMENDED PURCHASE ORDER]*\n` : '');
                const message = `${prefix}*Subject:* Purchase Order - The Caffeine Ministry\n*PO Number:* ${po.id || ''}\n*Date:* ${po.date || ''}\n\nHello ${po.supplier || ''},\nPlease arrange the delivery of the following items:\n\n*Order Details:*\n${itemList}\n\n*Delivery Address:*\nThe Caffeine Ministry \n'PARASUDAI', 672, 12th C Road, \nSardarpura, Jodhpur\n\nThank you,\nTeam Caffeine Ministry`;
                
                let phonesToUse = customPhones;
                if (!phonesToUse) {
                    const savedPhones = po.supplierPhone ? po.supplierPhone.split(',').map(p=>p.trim()).filter(Boolean) : [];
                    if (savedPhones.length > 1) {
                        const sel = window.prompt("Multiple numbers found. Enter target to text:\n" + savedPhones.join(' | '), savedPhones[0]);
                        if (!sel) return; phonesToUse = [sel.trim()];
                    } else { phonesToUse = savedPhones; }
                }
                if (!phonesToUse || phonesToUse.length === 0) return showToast("PO saved (No phone checked).", "info");
                
                phonesToUse.forEach((phone, idx) => {
                    setTimeout(() => {
                        let phoneStr = phone.replace(/\D/g, ''); if (phoneStr.length === 10) phoneStr = '91' + phoneStr; 
                        window.open('https://wa.me/' + phoneStr + '?text=' + encodeURIComponent(message), '_blank');
                    }, idx * 800);
                });
            };

            const createCombinedPO = (selectedItems, vendorObj, targetPhones) => {
                const rawPoId = generatePONumber(); const safeDbId = rawPoId.replace(/\//g, '-');
                const newPo = { id: rawPoId, supplier: vendorObj.name, supplierPhone: vendorObj.phone, status: 'Approved', date: new Date().toLocaleDateString('en-GB') };
                const combinedItems = [];
                selectedItems.forEach(si => { const existing = combinedItems.find(i => i.name === si.item.name && i.unit === si.item.unit); if (existing) existing.qty = Number(existing.qty) + Number(si.item.qty); else combinedItems.push({...si.item, qty: Number(si.item.qty)}); });
                newPo.items = combinedItems; db.collection('pos').doc(safeDbId).set(newPo);
                const reqsToUpdate = {};
                selectedItems.forEach(si => { if (!reqsToUpdate[si.reqId]) reqsToUpdate[si.reqId] = []; reqsToUpdate[si.reqId].push(si.itemIndex); });
                Object.keys(reqsToUpdate).forEach(reqId => { const req = requests.find(r => r.id === reqId); if (req) { const indicesToRemove = reqsToUpdate[reqId]; const remaining = (req.items || []).filter((_, idx) => !indicesToRemove.includes(idx)); if (remaining.length === 0) db.collection('requests').doc(reqId).delete(); else db.collection('requests').doc(reqId).update({ items: remaining }); } });
                sendWhatsApp(newPo, false, targetPhones);
            };

            const receivePO = (poId, receivedItemsData) => {
                db.collection('pos').doc(poId.replace(/\//g, '-')).update({ status: 'Delivered', receivedItems: receivedItemsData, deliveryDate: new Date().toLocaleDateString('en-GB') });
                const newPrices = { ...prices }; let pricesUpdated = false;
                receivedItemsData.forEach(item => { if (item.receivedQty > 0 && item.totalPrice && Number(item.totalPrice) > 0) { const existingGst = prices[item.name]?.gst || 0; newPrices[item.name] = { price: Number((Number(item.totalPrice) / Number(item.receivedQty)).toFixed(2)), unit: item.unit, gst: existingGst }; pricesUpdated = true; } });
                if (pricesUpdated) db.collection('settings').doc('main').update({ prices: newPrices });
                showToast(pricesUpdated ? 'Intake logged & Master Prices updated!' : 'Intake registered!', 'success');
            };

            const removeRequestItem = (reqId, itemIndex) => confirmAction("Remove item?", () => { const req = requests.find(r => r.id === reqId); const remaining = (req.items || []).filter((_, idx) => idx !== itemIndex); if (remaining.length === 0) db.collection('requests').doc(reqId).delete(); else db.collection('requests').doc(reqId).update({ items: remaining }); });
            const deletePO = (poId) => confirmAction("Delete official PO?", () => db.collection('pos').doc(poId.replace(/\//g, '-')).delete());

            if (loading) return ( <div className="min-h-screen bg-paper flex flex-col items-center justify-center font-serif text-victorian"> <p className="animate-pulse font-bold tracking-widest uppercase">Loading BrewOps Engine...</p> </div> );

            if (!role) {
                return (
                    <div className="min-h-screen flex justify-center items-center overflow-hidden relative bg-[#FAF8F5]">

                                    <select value={selectedVendor} onChange={e => setSelectedVendor(e.target.value)} className="w-full p-4 border border-brandBrown/20 rounded-xl text-sm bg-white font-bold text-victorian focus:ring-2 focus:ring-brandBrown"><option value="">-- Assign Corporate Account --</option>{suppliers.map((s, idx) => <option key={`sel-ven-${idx}`} value={s.name || ''}>{s.name || 'Unknown'}</option>)}</select>
                                ) : (
                                    <select value={amendPoId} onChange={e => setAmendPoId(e.target.value)} className="w-full p-4 border border-brandBrown/20 rounded-xl text-sm bg-white font-bold text-brandBrown focus:ring-2 focus:ring-brandBrown">{activePOs.map((po, idx) => <option key={`sel-po-${idx}`} value={po.id}>{po.id} — [{po.supplier}]</option>)}</select>
                                )}

                                {availablePhonesList.length > 0 && (
                                    <div className="flex flex-col gap-2 mt-2 bg-white p-3 rounded-xl border border-brandBrown/20 shadow-sm">
                                        <span className="text-[10px] font-bold text-gray-500 uppercase tracking-widest">WhatsApp Multi-Route Dispatch Targets:</span>
                                        {availablePhonesList.map(phone => (
                                            <label key={phone} className="flex items-center gap-3 cursor-pointer"><input type="checkbox" className="vintage-checkbox !w-4 !h-4" checked={targetPhones.includes(phone)} onChange={(e) => { if(e.target.checked) setTargetPhones([...targetPhones, phone]); else setTargetPhones(targetPhones.filter(p => p !== phone)); }} /><span className="text-sm font-medium text-victorian">{phone}</span></label>
                                        ))}
                                    </div>
                                )}

                                <button onClick={handleGeneratePO} className="w-full bg-brandBrown text-white font-bold py-4 rounded-xl shadow-lg transition-all hover:-translate-y-0.5 uppercase tracking-widest text-xs flex justify-center items-center gap-2"><Icons.Send/> {amendPoId ? 'Inject and Transmit Amended PO' : 'Issue Branded Purchase Order'}</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
